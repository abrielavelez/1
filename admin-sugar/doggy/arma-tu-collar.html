<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@500;700&family=Nunito:wght@600;800;900&display=swap">

<body class="doggy" data-root="../">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wavy"><feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="1" seed="4"/><feDisplacementMap in="SourceGraphic" scale="46"/></filter></svg>
<div class="bg" aria-hidden="true"></div>
<h1 class="page-title">Arma su collar 🎨</h1>
<p class="page-sub">Elige la cuerda, su nombre y sus charms. El precio se calcula solo.</p>
<div class="builder" id="builder">
  <section class="stage" aria-label="Vista previa">
    <svg id="art" viewBox="0 0 360 300" role="img" aria-label="Vista previa del collar"></svg>
    <div class="live"><span>Así va quedando</span></div>
  </section>
  <section class="wiz" aria-label="Pasos">
    <div class="steps" role="tablist" id="steps"></div>
    <div id="panel"></div>
  </section>
</div>
<div class="cbar"><div class="in"><div class="t"><small>Total</small><b id="total">$0</b></div><button type="button" id="nextBtn">Siguiente →</button></div></div>
<script src="../assets/js/sugar.js"></script>
