<title>Sugar Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800;900&family=Bagel+Fat+One&family=Caveat:wght@700&family=IBM+Plex+Mono:wght@500;600&family=Abril+Fatface&family=Great+Vibes&display=swap">
<style>
/* Layout: a back-office for one person on a phone — sticky header, four tabs, long scannable lists, full-screen editor sheet, plus a full-screen home preview built from the same data. Sugar pastel world, single theme by choice. */
:root{
  --bg:#FFF8E4; --card:#FFFFFF; --ink:#2A1638; --soft:#6B5A78; --line:#E9DFF3;
  --pink:#E66A92; --cherry:#E63B2E; --yellow:#F5D738; --blue:#3E9AD6; --green:#34A96A; --purple:#7B3AF5; --paper:#FFFDF6;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --sign:"Bagel Fat One","Cooper Black","Arial Black",sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font:700 26px/1 var(--display)}
h1 span{color:var(--pink)}
.hright{display:flex;gap:8px;align-items:center}
.status{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:#fff;border:2px solid var(--line);white-space:nowrap}
.status.saving{border-color:var(--yellow)} .status.err{border-color:var(--cherry);color:var(--cherry)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:9px 2px;font-weight:900;font-size:13px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 13px;font-weight:900;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--yellow)}
.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff}
.btn{border:2px solid var(--ink);border-radius:12px;padding:9px 14px;font-weight:900;cursor:pointer;background:#fff;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--ink);color:#fff}
.btn.home{background:#7BC86C;border-color:var(--ink)}
.btn.danger{border-color:var(--cherry);color:var(--cherry)}
.btn.danger.sure{background:var(--cherry);color:#fff}
.summary{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:900;color:var(--soft)}
.summary b{color:var(--ink)}
.list{display:grid;gap:8px;margin-top:6px}
.group{font:700 15px var(--display);margin:10px 0 0;color:var(--soft)}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;cursor:pointer}
.row:hover{border-color:var(--ink)}
.row.off{opacity:.55}
.thumb{width:56px;height:56px;border-radius:12px;background:#F4ECFA;display:grid;place-items:center;overflow:hidden;font-size:24px}
.thumb.round{border-radius:50%;border:2px solid var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:44px;height:44px}
.thumb .mono{font:400 24px var(--sign);color:#fff}
.info{min-width:0}
.info b{display:block;font:700 16px/1.15 var(--display);overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--soft);font-weight:800}
.price{font-weight:900}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.badge{font-size:10.5px;font-weight:900;border-radius:999px;padding:2px 7px;background:#F4ECFA}
.badge.out{background:#FDE2E0;color:var(--cherry)} .badge.low{background:#FFF0C2;color:#8A5A00} .badge.hid{background:#E8E8EE} .badge.ex{background:#E0EEFF}
.count{font-weight:900;font-size:13px;text-align:right;color:var(--soft)}
.count b{display:block;font:700 20px var(--display);color:var(--ink)}
.stock{display:flex;align-items:center;gap:4px}
.stock button{width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-weight:900;font-size:18px;cursor:pointer;line-height:1}
.stock output{min-width:30px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 12px;color:var(--soft);font-weight:800;background:#fff;border:2px dashed var(--line);border-radius:16px}
.panel{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;margin-top:6px}
.panel h2{margin:0;font:700 19px var(--display)}
.panel p{margin:0;color:var(--soft);font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .h{font-size:11px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.grid3 input{border:2px solid var(--line);border-radius:10px;padding:8px;min-width:0;width:100%}
.field{display:grid;gap:4px;font-size:13px;font-weight:900}
.field small{font-weight:700;color:var(--soft)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-weight:700}
.field input[type=color]{width:64px;height:44px;padding:3px;border-color:var(--ink)}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:900;cursor:pointer;background:#fff;width:100%;text-align:left}
.toggle i{width:44px;height:26px;border-radius:999px;background:#DDD3E8;position:relative;flex:none;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] i{background:var(--green)} .toggle[aria-pressed="true"] i::after{left:21px}
.seg{display:flex;gap:6px}.seg .btn{flex:1}.seg .btn[aria-pressed="true"]{background:var(--yellow)}
.colors{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.colors label{position:relative}
.colors input[type=color]{width:46px;height:46px;border:2px solid var(--ink);border-radius:50%;padding:0;background:none;cursor:pointer}
.colors input[type=color]::-webkit-color-swatch-wrapper{padding:0} .colors input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.colors .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:11px;font-weight:900;cursor:pointer;padding:0;line-height:1}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:88px;height:88px;border-radius:14px;background:#F4ECFA;overflow:hidden;display:grid;place-items:center;flex:none;color:var(--soft);font-size:12px;font-weight:800;text-align:center}
.photo .pv.round{border-radius:50%;border:2px solid var(--ink)}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.inlist{display:grid;gap:6px}
.inlist .it{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:13px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(42,22,56,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--bg);width:min(620px,100%);max-height:100%;overflow:auto;border-radius:22px 22px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:22px;max-height:92%}}
.sheet h2{margin:0;font:700 22px var(--display)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px}
.note{font-size:12.5px;color:var(--soft);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font-weight:900;padding:10px 16px;border-radius:12px;max-width:calc(100vw - 32px);text-align:center}
.hp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hp-card{background:#fff;border:2px solid var(--ink);border-radius:14px;overflow:hidden;display:grid}
.hp-card .im{aspect-ratio:1;background:#F4ECFA;display:grid;place-items:center;font-size:30px}
.hp-card .im img{width:100%;height:100%;object-fit:cover}
.hp-card div.t{padding:8px;font-weight:900;font-size:13px}
.hp-card div.t span{display:block;color:var(--cherry)}
.gate{max-width:420px;margin:60px auto;text-align:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px}

/* ---------- home preview: the Sugar desktop ---------- */
.hp{position:fixed;inset:0;z-index:80;overflow:auto;background:#5FA8E8 var(--hp-bg,url("img/fondo-pasto.jpg")) center/cover;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-rows:auto 1fr auto;gap:6px;--mono:"IBM Plex Mono","Courier New",monospace}
.hp-close{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));border:2px solid var(--ink);border-radius:8px;background:#fff;padding:6px 12px;font:600 13px var(--mono);cursor:pointer;z-index:84}
.hp-logo{justify-self:center;display:grid;margin:0;text-align:center;
  font:400 clamp(42px,7vw,86px)/0.92 "Abril Fatface","Didot","Bodoni 72",Georgia,serif;color:#FFF8EE;letter-spacing:.005em;text-shadow:0 3px 12px rgba(20,40,90,.3)}
.hp-logo em{justify-self:end;margin:.06em -.15em 0 0;font:400 clamp(24px,3.4vw,42px)/1 "Great Vibes","Snell Roundhand",cursive;font-style:normal;letter-spacing:0;white-space:nowrap;color:#FFF8EE;text-shadow:0 2px 8px rgba(20,40,90,.3)}
.hp-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.6fr) minmax(0,1.2fr);align-items:center;gap:clamp(8px,2vw,32px);min-height:0}
.hp-icons{display:flex;flex-direction:column;gap:clamp(4px,1.4vh,14px);align-items:center;justify-content:center}
.ico{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:grid;justify-items:center;gap:6px;background:none;border:0;padding:6px;border-radius:8px;
  animation:bob 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.ico:hover,.ico:focus-visible{background:rgba(255,255,255,.25)}
.ico img{height:clamp(40px,6.4vh,72px);width:auto;max-width:110px;object-fit:contain;image-rendering:auto;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.ico img.px{image-rendering:pixelated}
.ico .noimg{width:clamp(40px,6.4vh,72px);aspect-ratio:1;border-radius:12px;background:var(--c);display:grid;place-items:center;font:400 30px var(--sign);color:#fff;border:3px solid #fff}
.ico b{font:600 clamp(13px,1.5vw,17px)/1.1 var(--mono);color:#111;text-shadow:0 0 3px #fff,0 0 6px #fff;letter-spacing:.02em;text-align:center}
.ico.locked{opacity:.6;cursor:not-allowed}
.ico.nudge{animation:nudge .9s ease-in-out}
.hp-icons .ico.nudge{--nx:14px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes nudge{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(var(--nx,14px),-10px) rotate(-6deg)}60%{transform:translate(calc(var(--nx,14px) * .4),0) rotate(4deg)}}
.hp-c{position:relative;display:grid;place-items:center}
.hp-tray{position:relative;width:min(100%,560px);filter:drop-shadow(0 18px 22px rgba(20,60,10,.35))}
.hp-tray>img{width:100%;display:block;pointer-events:none}
.hp-tray.over{filter:drop-shadow(0 0 18px #fff) drop-shadow(0 0 8px var(--yellow))}
.hp-tray.shake{animation:tshake .5s}
@keyframes tshake{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.hp-slot{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;pointer-events:none}
.hp-slot img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.hp-slot span{font:600 clamp(11px,1.6vw,16px)/1 var(--mono);background:#fff;padding:4px 6px;border-radius:4px;white-space:nowrap}
.hp-right{display:grid;gap:10px;justify-items:center;align-content:center}
.dog{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:none;border:0;padding:0;display:grid;justify-items:center;animation:bob 3.6s ease-in-out infinite;animation-delay:.6s}
.dog .pup{height:clamp(170px,36vh,360px);width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 12px 14px rgba(0,0,0,.3));pointer-events:none}
.dog .dlogo{width:clamp(150px,15vw,240px);height:auto;margin-top:-18px;transform:rotate(-4deg);pointer-events:none;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.dog.nudge{animation:nudge .9s ease-in-out;--nx:-14px}
@keyframes ring{0%,88%,100%{transform:rotate(0)}90%{transform:rotate(-5deg)}92%{transform:rotate(5deg)}94%{transform:rotate(-4deg)}96%{transform:rotate(3deg)}}
.hp-foot{text-align:center;margin:0;font:700 clamp(19px,2.6vw,26px)/1 var(--hand);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hp-ghost{position:fixed;z-index:85;pointer-events:none;transform:translate(-50%,-50%) rotate(-5deg);animation:none}
@media (max-width:760px){
  .hp-board{grid-template-columns:1fr 1fr;grid-template-areas:"c c" "i i" "r r";row-gap:18px}
  .hp-c{grid-area:c} .hp-icons{grid-area:i;flex-direction:row;justify-content:flex-start;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;gap:6px} .hp-icons .ico{flex:none} .hp-right{grid-area:r}
  .dog .pup{height:170px} .dog .dlogo{width:170px}
  .hp-logo{margin-top:40px}
}
/* the shop window */
.win{position:fixed;inset:max(10px,4vh) max(10px,4vw);z-index:86;display:grid;grid-template-rows:auto auto 1fr;background:#ECE9D8;border:3px solid #0A246A;border-radius:10px 10px 6px 6px;box-shadow:0 20px 50px rgba(0,0,0,.45);overflow:hidden;font-family:var(--body)}
.win .bar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:linear-gradient(#3A8BF5,#0A54D8 60%,#0A46B8);color:#fff;font:700 15px var(--display)}
.win .bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .bar button{width:28px;height:26px;border-radius:5px;border:1px solid #fff;background:linear-gradient(#F08A70,#D9431E);color:#fff;font-weight:900;cursor:pointer}
.win .tabsw{display:flex;gap:4px;overflow-x:auto;padding:8px 8px 0;background:#ECE9D8;border-bottom:2px solid #9C9A8A;scrollbar-width:none}
.win .tabsw button{flex:none;border:2px solid #9C9A8A;border-bottom:0;border-radius:8px 8px 0 0;background:#F5F4EA;padding:6px 12px;font:700 13px var(--body);cursor:pointer;display:flex;gap:6px;align-items:center}
.win .tabsw button img{height:20px}
.win .tabsw button[aria-selected="true"]{background:#fff;position:relative;top:2px}
.win .body{overflow:auto;background:#fff;padding:14px}
.win .body .note{margin:0 0 10px}
@media (prefers-reduced-motion:reduce){.ico,.dog{animation:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="hrow"><h1>Sugar <span>Admin</span></h1><div class="hright"><button type="button" class="btn home" id="homeBtn">🏡 Ver home</button><span class="status" id="status" role="status">Conectando…</span></div></div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button type="button" role="tab" data-tab="productos" aria-selected="true">Productos</button>
      <button type="button" role="tab" data-tab="categorias" aria-selected="false">Categorías</button>
      <button type="button" role="tab" data-tab="collar" aria-selected="false">Arma collar</button>
      <button type="button" role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
    </nav>
    <div class="sub" id="subnav"></div>
    <div class="tools" id="tools"></div>
  </header>
  <main id="main"><div class="empty">Cargando tu tienda…</div></main>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="sheetCard" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="hp" id="hp" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => n == null || n === "" ? "Consultar" : "$" + (Number.isInteger(+n) ? +n : (+n).toFixed(2));
const LOW = 3;
const MARCAS = { club: "Sugar Club", doggy: "Doggy Pops", match: "Match" };
const ICONS = ["estrella","corazon","cereza","hueso","nube","helado","sapo","florCristal","brillo"];
const INK = "#2A1638";
const ICON = {
  estrella:`<polygon points="0,-15 4.1,-5.7 14.3,-4.6 6.7,2.2 8.8,12.1 0,7 -8.8,12.1 -6.7,2.2 -14.3,-4.6 -4.1,-5.7" fill="#F5D738" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`,
  corazon:`<path d="M0,13 C-22,-1 -15,-18 0,-8 C15,-18 22,-1 0,13Z" fill="#E66A92" stroke="${INK}" stroke-width="2.5"/>`,
  cereza:`<path d="M-6,3 Q-3,-12 4,-16 Q4,-5 8,5" fill="none" stroke="#34A96A" stroke-width="3"/><circle cx="-7" cy="7" r="7" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle cx="8" cy="8" r="7" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/>`,
  hueso:`<path d="M-12,-4 a5,5 0 1 1 4,-6 h16 a5,5 0 1 1 4,6 a5,5 0 1 1 -4,6 h-16 a5,5 0 1 1 -4,-6z" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`,
  nube:`<path d="M-14,6 a7,7 0 0 1 2,-13 a9,9 0 0 1 16,-2 a7,7 0 0 1 10,9 a6,6 0 0 1 -4,6z" fill="#CDB6FF" stroke="${INK}" stroke-width="2.5"/>`,
  helado:`<path d="M-8,-1 L0,17 L8,-1Z" fill="#E9B872" stroke="${INK}" stroke-width="2.5"/><circle cy="-6" r="10" fill="#F7A8C9" stroke="${INK}" stroke-width="2.5"/>`,
  sapo:`<ellipse cy="4" rx="14" ry="10" fill="#6CCB7A" stroke="${INK}" stroke-width="2.5"/><circle cx="-7" cy="-6" r="5" fill="#6CCB7A" stroke="${INK}" stroke-width="2.5"/><circle cx="7" cy="-6" r="5" fill="#6CCB7A" stroke="${INK}" stroke-width="2.5"/>`,
  florCristal:`<circle cx="0" cy="-10" r="8" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle cx="9.5" cy="-3" r="8" fill="#9AA8F5" stroke="${INK}" stroke-width="2.5"/><circle cx="6" cy="8" r="8" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle cx="-6" cy="8" r="8" fill="#9AA8F5" stroke="${INK}" stroke-width="2.5"/><circle cx="-9.5" cy="-3" r="8" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle r="6.5" fill="#FF5A6E" stroke="${INK}" stroke-width="2"/>`,
  brillo:`<path d="M0,-17 Q3,-3 17,0 Q3,3 0,17 Q-3,3 -17,0 Q-3,-3 0,-17Z" fill="#FFE48A" stroke="${INK}" stroke-width="2.5"/>`
};
const iconSvg = id => `<svg viewBox="-20 -20 40 40" aria-hidden="true">${ICON[id] || ICON.estrella}</svg>`;

let pending = 0;

function saving(p) {

function stockBadge(it) {

  if (it.stock === 0) return `<span class="badge out">Agotado</span>`;

}
function thumb(it, col) {
  if (col === "categorias") { const src = catIcon(it); return `<div class="thumb round" style="background:${esc(it.color || "#ddd")}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="mono">${esc((it.nombre || "?").charAt(0))}</span>`}</div>`; }

  if (col === "cordones") { const c = it.colores?.length ? it.colores : ["#ddd"]; return `<div class="thumb" style="background:linear-gradient(135deg,${c.map((x, i) => `${x} ${i * 100 / c.length}% ${(i + 1) * 100 / c.length}%`).join(",")})"></div>`; }
  if (col === "charms") return `<div class="thumb">${iconSvg(it.icono)}</div>`;

}

    <div class="stock" data-stock>${st === null ? `<button type="button" class="btn" data-setstock style="width:auto;height:auto;font-size:12px;padding:6px 8px">+ stock</button>` :
      `<button type="button" data-step="-1" aria-label="Restar 1">−</button><output>${st}</output><button type="button" data-step="1" aria-label="Sumar 1">+</button>`}</div>

function fieldHtml(f, d) {
  if (f.when && !f.when(d)) return "";
  const v = d[f.k], id = "f_" + f.k, help = f.help ? `<small>${esc(f.help)}</small>` : "";
  switch (f.t) {
    case "text": return `<label class="field" for="${id}">${f.label}<input id="${id}" data-k="${f.k}" value="${esc(v ?? "")}" ${f.req ? "required" : ""}>${help}</label>`;
    case "textarea": return `<label class="field" for="${id}">${f.label}<textarea id="${id}" data-k="${f.k}">${esc(v ?? "")}</textarea>${help}</label>`;
    case "number": return `<label class="field" for="${id}">${f.label}<input id="${id}" data-k="${f.k}" data-num type="number" inputmode="decimal" step="any" min="0" value="${v ?? ""}">${help}</label>`;
    case "color": return `<label class="field" for="${id}">${f.label}<input id="${id}" data-k="${f.k}" type="color" value="${esc(v || "#E63B2E")}">${help}</label>`;
    case "list": return `<label class="field" for="${id}">${f.label}<input id="${id}" data-k="${f.k}" data-list value="${esc((v || []).join(", "))}">${help}</label>`;
    case "seg": return `<div class="field">${f.label}<div class="seg">${f.opts.map(([k, l]) => `<button type="button" class="btn" data-seg="${f.k}" data-v="${k}" aria-pressed="${v === k}">${l}</button>`).join("")}</div></div>`;
    case "select": { const o = f.opts(d); const has = o.some(([k]) => k === v); return `<label class="field" for="${id}">${f.label}<select id="${id}" data-k="${f.k}">${has || v == null || v === "" ? "" : `<option value="${esc(v)}">${esc(v)}</option>`}${o.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>${help}</label>`; }
    case "toggle": return `<button type="button" class="toggle" data-toggle="${f.k}" aria-pressed="${v ? "true" : "false"}">${f.label}<i></i></button>`;
    case "colors": return `<div class="field">${f.label}<div class="colors">${(v || []).map((c, i) => `<label><input type="color" data-color="${i}" value="${esc(c)}" aria-label="Color ${i + 1}">${(v || []).length > 1 ? `<button type="button" class="x" data-rmcolor="${i}" aria-label="Quitar color">✕</button>` : ""}</label>`).join("")}<button type="button" class="btn" data-addcolor>+ color</button></div>${help}</div>`;
    case "photo": {
      const pid = f.k in ed.newPhotos ? ed.newPhotos[f.k] : v;
      const fb = !pid && f.fallback && d[f.fallback] ? d[f.fallback] : "";
      const src = pid ? blob(pid) : fb;
      return `<div class="field">${f.label}${f.help ? `<small>${esc(f.help)}</small>` : ""}<div class="photo"><div class="pv ${f.round ? "round" : ""}" style="${f.round ? `background:${esc(d.color || "#eee")}` : ""}">${src ? `<img src="${esc(src)}" alt="">` : "Sin foto"}</div>
      ${assets ? `<div style="display:grid;gap:6px"><label class="btn" for="up_${f.k}">${src ? "Cambiar foto" : "Subir foto"}</label><input type="file" id="up_${f.k}" data-up="${f.k}" accept="image/jpeg,image/png,image/webp">${src ? `<button type="button" class="btn" data-nophoto="${f.k}">Quitar foto</button>` : ""}</div>` : `<small>Las fotos solo se pueden subir con tu cuenta.</small>`}</div></div>`;
    }
  }
  return "";
}
function drawEditor() {
  const sch = SCHEMAS[ed.col], d = ed.data;
  let extra = "";
  if (ed.col === "categorias" && !ed.isNew) {
    const ps = prodsDe({ ...d, nombre: ed.oldName });
    extra = `<div class="field">Productos en esta categoría (${ps.length})<div class="inlist">${ps.map(p => `<div class="it" data-openprod="${esc(p.id)}"><span>${esc(p.nombre)}</span><span>${esc(p.precioTexto || money(p.precio))}</span></div>`).join("") || '<small>Todavía no hay productos.</small>'}</div>
      <button type="button" class="btn" data-addprod>+ Agregar producto a ${esc(ed.oldName)}</button></div>`;
  }
  $("#sheetCard").innerHTML = `<h2 id="sheetTitle">${ed.isNew ? "Nueva " + sch.title : "Editar " + sch.title}</h2>
    <form id="edForm" style="display:grid;gap:12px">${sch.fields.map(f => fieldHtml(f, d)).join("")}${extra}
    <div class="acts">${ed.isNew ? "<span></span>" : `<button type="button" class="btn danger" id="delBtn">Eliminar</button>`}<span style="display:flex;gap:8px"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri" id="saveBtn">Guardar</button></span></div></form>`;
  const f = $("#edForm");
  f.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.color !== undefined) { d.colores[+t.dataset.color] = t.value; return; }
    if (!t.dataset.k) return;
    d[t.dataset.k] = t.dataset.num !== undefined ? (t.value === "" ? null : +t.value) : t.dataset.list !== undefined ? t.value.split(",").map(s => s.trim()).filter(Boolean) : t.value;
    if (t.dataset.k === "color") { const pv = f.querySelector(".pv.round"); if (pv) pv.style.background = t.value; }
  });
  f.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.up && t.files[0]) return upload(t.dataset.up, t.files[0]);
    if (t.dataset.k === "marca" && ed.col === "productos") { d.categoria = catsDe(d.marca)[0]?.nombre || ""; drawEditor(); }
  });
  f.addEventListener("click", e => {
    const b = e.target.closest("button, [data-openprod]"); if (!b) return;
    if (b.dataset.toggle) { d[b.dataset.toggle] = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", d[b.dataset.toggle]); }
    if (b.dataset.seg) { d[b.dataset.seg] = b.dataset.v; f.querySelectorAll(`[data-seg="${b.dataset.seg}"]`).forEach(x => x.setAttribute("aria-pressed", x === b)); }
    if (b.dataset.addcolor !== undefined) { d.colores = [...(d.colores || []), "#FFFFFF"]; drawEditor(); }
    if (b.dataset.rmcolor !== undefined) { d.colores.splice(+b.dataset.rmcolor, 1); drawEditor(); }
    if (b.dataset.nophoto) { ed.newPhotos[b.dataset.nophoto] = null; if (b.dataset.nophoto === "iconoId") d.iconoSrc = null; if (b.dataset.nophoto === "bandejaId") d.bandejaSrc = null; drawEditor(); }
    if (b.dataset.close !== undefined) closeEditor();
    if (b.dataset.openprod) { const pid = b.dataset.openprod; closeEditor(); openEditor("productos", pid); }
    if (b.dataset.addprod !== undefined) { const preset = { marca: ed.data.marca, categoria: ed.oldName }; closeEditor(); openEditor("productos", null, preset); }
    if (b.id === "delBtn") {
      if (ed.col === "categorias" && prodsDe({ ...d, nombre: ed.oldName }).length) { toast("Primero mueve sus productos a otra categoría"); return; }
      if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Toca otra vez para eliminar"; return; }
      remove();
    }
  });
  f.onsubmit = e => { e.preventDefault(); save(); };
}
async function upload(k, file) {
  if (file.size > 20 * 1024 * 1024) return toast("La foto pesa demasiado (máx. 20 MB).");
  const btn = $(`label[for=up_${k}]`); if (btn) btn.textContent = "Subiendo…";
  try { const r = await saving(assets.upload(file)); ed.newPhotos[k] = r.id; drawEditor(); } catch (e) { drawEditor(); }
}
function closeEditor() {
  if (ed) for (const [k, v] of Object.entries(ed.newPhotos || {})) if (v && v !== ed.oldPhotos[k]) assets?.delete(v).catch(() => {});
  ed = null; $("#sheet").hidden = true;
}
async function save() {
  const d = ed.data, col = ed.col;
  if (!String(d.nombre || "").trim()) return toast("Ponle un nombre");
  d.nombre = d.nombre.trim();
  for (const [k, v] of Object.entries(ed.newPhotos)) d[k] = v || null;
  if (col === "categorias" && S.data.categorias.some(c => c.id !== ed.id && c.marca === d.marca && c.nombre.toLowerCase() === d.nombre.toLowerCase())) return toast("Ya existe una categoría con ese nombre");
  let id = ed.id;
  if (ed.isNew) { const base = (col === "productos" || col === "categorias" ? d.marca + "-" : "") + slug(d.nombre); id = base; let n = 2; while (S.data[col].some(x => x.id === id)) id = base + "-" + n++; }
  const body = { ...d, actualizado: Date.now() }; delete body.id;
  try {
    $("#saveBtn").disabled = true;
    await saving(db.doc(col + "/" + id).set(body));
    for (const [k, old] of Object.entries(ed.oldPhotos)) if (old && old !== body[k]) assets?.delete(old).catch(() => {});
    if (col === "categorias" && !ed.isNew && ed.oldName && ed.oldName !== d.nombre) {
      for (const p of S.data.productos.filter(p => p.marca === d.marca && p.categoria === ed.oldName)) await saving(db.doc("productos/" + p.id).update({ categoria: d.nombre }));
    }
    ed.newPhotos = {}; ed = null; $("#sheet").hidden = true; toast("Guardado");
  } catch (e) { const b = $("#saveBtn"); if (b) b.disabled = false; }
}
async function remove() {
  const { col, id, oldPhotos } = ed;
  try { await saving(db.doc(col + "/" + id).delete()); for (const v of Object.values(oldPhotos)) if (v) assets?.delete(v).catch(() => {}); ed = null; $("#sheet").hidden = true; toast("Eliminado"); } catch (e) {}
}
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeEditor(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#sheet").hidden) closeEditor(); else if (!$("#hp").hidden) closeHome(); } });

/* ---------- quick stock ---------- */
const stockTimers = {};
function bumpStock(col, id, delta) {
  const it = S.data[col].find(x => x.id === id); if (!it) return;
  it.stock = Math.max(0, (typeof it.stock === "number" ? it.stock : 0) + delta);
  renderMain();
  clearTimeout(stockTimers[col + id]);
  stockTimers[col + id] = setTimeout(() => saving(db.doc(col + "/" + id).update({ stock: it.stock, actualizado: Date.now() })).catch(() => {}), 700);
}
$("#main").addEventListener("click", e => {
  const r = e.target.closest(".row"); if (!r) return;
  const st = e.target.closest("[data-stock]");
  if (st) {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.step) bumpStock(r.dataset.col, r.dataset.id, +b.dataset.step);
    if (b.dataset.setstock !== undefined) bumpStock(r.dataset.col, r.dataset.id, 1);
    return;
  }
  openEditor(r.dataset.col, r.dataset.id);
});
document.addEventListener("click", e => {
  const t = e.target.closest(".tabs [data-tab]"); if (t) { S.tab = t.dataset.tab; S.sub = { productos: "todo", categorias: "club", collar: "cordones" }[S.tab] || ""; S.q = ""; render(); return; }
  const s = e.target.closest("#subnav [data-sub]"); if (s) { S.sub = s.dataset.sub; S.q = ""; render(); return; }
  const n = e.target.closest("[data-new]"); if (n) openEditor(n.dataset.new, null);
});

/* ---------- home preview: the Sugar desktop (built from Categorías + Productos + Ajustes) ---------- */
const TRAY_SLOTS = [[78, 33, 26], [17, 63, 13], [41, 31, 13], [61, 79, 30], [17, 17, 11]];
let hpFilled = 0, hpDrag = null, nudgeTimer = null, winBrand = "club";
const homeCfg = () => S.ajustes?.home || {};
function openHome() {
  const h = homeCfg(), cats = catsDe("club").filter(c => c.disponible !== false);
  const dogSrc = h.doggyFotoId ? blob(h.doggyFotoId) : "img/doggy-miel.png";
  const icon = (c, i) => { const src = catIcon(c); return `<button type="button" class="ico ${c.bloqueada ? "locked" : ""}" data-cat="${esc(c.id)}" style="--d:${(i * .37).toFixed(2)}s;--c:${esc(c.color || "#E63B2E")}" aria-label="${esc(c.nombre)}">${src ? `<img class="${/icon-(carpeta|cd|sobre|disquete)/.test(src) ? "px" : ""}" src="${esc(src)}" alt="">` : `<span class="noimg">${esc(c.nombre.charAt(0))}</span>`}<b>${esc(c.nombre)}</b></button>`; };
  const hp = $("#hp");
  hp.style.setProperty("--hp-bg", `url("img/fondo-${h.fondo === "cuadros" ? "cuadros" : "pasto"}.jpg")`);
  hp.innerHTML = `<button type="button" class="hp-close" id="hpClose">✕ Volver al admin</button>
    <h2 class="hp-logo"><span>Sugar Club</span>${h.eslogan ? `<em>${esc(h.eslogan)}</em>` : ""}</h2>
    <div class="hp-board">
      <nav class="hp-icons" aria-label="Categorías">${cats.map(icon).join("")}</nav>
      <div class="hp-c"><div class="hp-tray" id="hpTray"><img src="img/bandeja.png" alt="Bandeja"></div></div>
      <div class="hp-right">
        <button type="button" class="dog" id="hpDog" aria-label="Sugar Doggy Pops"><img class="pup" src="${esc(dogSrc)}" alt=""><img class="dlogo" src="${esc(h.doggyLogoId ? blob(h.doggyLogoId) : "img/logo-doggy.png")}" alt="Sugar Doggy Pops"></button>
      </div>
    </div>
    <p class="hp-foot">${esc(h.pie ?? "Hecho con todo el amor del mundo 💖")}</p>
    <div id="hpWin"></div>`;
  hp.hidden = false; document.body.style.overflow = "hidden"; hpFilled = 0;
  $("#hpClose").onclick = closeHome;
  clearInterval(nudgeTimer);
  nudgeTimer = setInterval(() => {
    const all = [...hp.querySelectorAll(".ico:not(.locked), .dog")]; if (!all.length || hpDrag) return;
    const el = all[Math.floor(Math.random() * all.length)]; el.classList.remove("nudge"); void el.offsetWidth; el.classList.add("nudge");
    setTimeout(() => el.classList.remove("nudge"), 950);
  }, 1800);
}
function closeHome() { $("#hp").hidden = true; document.body.style.overflow = ""; clearInterval(nudgeTimer); }
function toTray(src, label) {
  const k = hpFilled++ % TRAY_SLOTS.length, [x, y, w] = TRAY_SLOTS[k], tray = $("#hpTray");
  tray.querySelector(`.hp-slot[data-k="${k}"]`)?.remove();
  const el = document.createElement("div"); el.className = "hp-slot"; el.dataset.k = k;
  el.style.cssText = `left:${x}%;top:${y}%;width:${w}%;height:${w * 1.25}%`;
  el.innerHTML = src ? `<img src="${esc(src)}" alt="">` : `<span>${esc(label)}</span>`;
  tray.appendChild(el); tray.classList.remove("shake"); void tray.offsetWidth; tray.classList.add("shake");
}
function openWin(brand, catName) {
  winBrand = brand;
  const cats = catsDe(brand).filter(c => c.disponible !== false && !c.bloqueada);
  const cur = cats.find(c => c.nombre === catName) || cats[0];
  const ps = cur ? prodsDe(cur).filter(p => p.disponible !== false) : [];
  const brandName = brand === "doggy" ? "Sugar Doggy Pops" : "Sugar Club";
  $("#hpWin").innerHTML = `<section class="win" role="dialog" aria-label="${esc(brandName)}">
    <div class="bar"><span>🍒 ${esc(brandName)} — ${esc(cur?.nombre || "")}</span><button type="button" id="winX" aria-label="Cerrar">✕</button></div>
    <div class="tabsw" role="tablist">${cats.map(c => { const src = catIcon(c); return `<button type="button" role="tab" data-wtab="${esc(c.nombre)}" aria-selected="${c === cur}">${src ? `<img src="${esc(src)}" alt="">` : ""}${esc(c.nombre)}</button>`; }).join("")}</div>
    <div class="body"><p class="note">${ps.length} producto${ps.length === 1 ? "" : "s"} · vista previa de la tienda (la canasta de compra viene en el siguiente paso)</p>
    ${ps.length ? `<div class="hp-grid">${ps.map(p => `<div class="hp-card"><div class="im">${p.fotoId ? `<img src="${esc(blob(p.fotoId))}" alt="">` : "🍒"}</div><div class="t">${esc(p.nombre)}<span>${esc(p.precioTexto || money(p.precio))}</span></div></div>`).join("")}</div>` : `<div class="empty">Esta categoría todavía no tiene productos. Cárgalos en la pestaña Productos.</div>`}</div></section>`;
  $("#winX").onclick = () => $("#hpWin").innerHTML = "";
  $("#hpWin").querySelectorAll("[data-wtab]").forEach(b => b.onclick = () => openWin(winBrand, b.dataset.wtab));
}
function activate(el) {
  if (el.id === "hpDog") { toTray(el.querySelector(".pup").src, "Doggy Pops"); return setTimeout(() => openWin("doggy"), 350); }
  const c = S.data.categorias.find(x => x.id === el.dataset.cat); if (!c) return;
  if (c.bloqueada) return toast(`${c.nombre} llega muy pronto ✨`);
  toTray(catTray(c), c.nombre); setTimeout(() => openWin("club", c.nombre), 350);
}
$("#homeBtn").addEventListener("click", openHome);
const hpEl = $("#hp");
const overTray = (x, y) => { const t = $("#hpTray")?.getBoundingClientRect(); return t && x > t.left && x < t.right && y > t.top && y < t.bottom; };
hpEl.addEventListener("pointerdown", e => { const b = e.target.closest(".ico, .dog"); if (!b) return; hpDrag = { b, x0: e.clientX, y0: e.clientY, id: e.pointerId, g: null }; b.setPointerCapture(e.pointerId); });
hpEl.addEventListener("pointermove", e => {
  if (!hpDrag || e.pointerId !== hpDrag.id) return;
  if (!hpDrag.g && Math.hypot(e.clientX - hpDrag.x0, e.clientY - hpDrag.y0) > 8) { const r = hpDrag.b.getBoundingClientRect(), g = hpDrag.b.cloneNode(true); g.classList.add("hp-ghost"); g.style.width = Math.min(r.width, 160) + "px"; document.body.appendChild(g); hpDrag.g = g; }
  if (hpDrag.g) { hpDrag.g.style.left = e.clientX + "px"; hpDrag.g.style.top = e.clientY + "px"; $("#hpTray").classList.toggle("over", overTray(e.clientX, e.clientY)); }
});
function hpEnd(e, cancel) {
  if (!hpDrag || e.pointerId !== hpDrag.id) return;
  const { b, g } = hpDrag; hpDrag = null; $("#hpTray")?.classList.remove("over");
  if (g) { g.remove(); if (!cancel && overTray(e.clientX, e.clientY)) activate(b); return; }
  if (!cancel) activate(b);
}
hpEl.addEventListener("pointerup", e => hpEnd(e, false));
hpEl.addEventListener("pointercancel", e => hpEnd(e, true));


/* ---------- boot ---------- */
(async () => {
  render();
  const timer = setTimeout(() => { if (!db) status("err", "Sin conexión"); }, 10000);
  db = await window.claude?.use?.("db");
  clearTimeout(timer);
  if (!db) { $("#main").innerHTML = `<div class="gate"><b>Abre este panel con tu cuenta de Claude.</b><p class="note">Desde aquí no se pueden ver ni guardar los productos.</p></div>`; status("err", "Sin acceso"); return; }
  status("", "Conectado");
  for (const col of ["productos", "categorias", "cordones", "charms", "placas", "estilos"]) {
    db.collection(col).onSnapshot(snap => {
      S.data[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded.add(col); if (!ed && viewCols().includes(col) && !document.activeElement?.closest("form")) renderMain();
    }, () => status("err", "Error al cargar"));
  }
  db.doc("ajustes/general").onSnapshot(snap => { S.ajustes = snap.exists ? snap.data() : {}; if (!ed && viewCols().includes("ajustes") && !document.activeElement?.closest("form")) renderMain(); }, () => {});
  assets = await window.claude?.use?.("assets");
})();
</script>
