<title>Sugar Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fredoka:wght@500;700&family=Nunito:wght@600;800;900&family=Bagel+Fat+One&family=Caveat:wght@700&family=IBM+Plex+Mono:wght@500;600&family=Abril+Fatface&family=Great+Vibes&display=swap">
<style>
/* Layout: a back-office for one person on a phone — sticky header, four tabs, long scannable lists, full-screen editor sheet, plus a full-screen home preview built from the same data. Sugar pastel world, single theme by choice. */
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#16181D; --soft:#636B78; --line:#E2E5EA;
  --pink:#D6336C; --cherry:#D92D20; --yellow:#FDF2C4; --blue:#2563EB; --green:#15803D; --purple:#4F46E5; --paper:#FFFDF6;
  --display:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sign:"Bagel Fat One","Cooper Black","Arial Black",sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font:700 26px/1 var(--display)}
h1 span{color:var(--pink)}
.hright{display:flex;gap:8px;align-items:center}
.status{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:#fff;border:2px solid var(--line);white-space:nowrap}
.status.saving{border-color:var(--yellow)} .status.err{border-color:var(--cherry);color:var(--cherry)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:9px 2px;font-weight:900;font-size:13px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 13px;font-weight:900;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--yellow)}
.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff}
.btn{border:2px solid var(--ink);border-radius:12px;padding:9px 14px;font-weight:900;cursor:pointer;background:#fff;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--ink);color:#fff}
.btn.home{background:#7BC86C;border-color:var(--ink)}
.btn.danger{border-color:var(--cherry);color:var(--cherry)}
.btn.danger.sure{background:var(--cherry);color:#fff}
.summary{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:900;color:var(--soft)}
.summary b{color:var(--ink)}
.list{display:grid;gap:8px;margin-top:6px}
.group{font:700 15px var(--display);margin:10px 0 0;color:var(--soft)}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;cursor:pointer}
.row:hover{border-color:var(--ink)}
.row.off{opacity:.55}
.thumb{width:56px;height:56px;border-radius:12px;background:#F4ECFA;display:grid;place-items:center;overflow:hidden;font-size:24px}
.thumb.round{border-radius:50%;border:2px solid var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:44px;height:44px}
.thumb .mono{font:400 24px var(--sign);color:#fff}
.info{min-width:0}
.info b{display:block;font:700 16px/1.15 var(--display);overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--soft);font-weight:800}
.price{font-weight:900}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.badge{font-size:10.5px;font-weight:900;border-radius:999px;padding:2px 7px;background:#F4ECFA}
.badge.out{background:#FDE2E0;color:var(--cherry)} .badge.low{background:#FFF0C2;color:#8A5A00} .badge.hid{background:#E8E8EE} .badge.ex{background:#E0EEFF}
.count{font-weight:900;font-size:13px;text-align:right;color:var(--soft)}
.count b{display:block;font:700 20px var(--display);color:var(--ink)}
.stock{display:flex;align-items:center;gap:4px}
.stock button{width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-weight:900;font-size:18px;cursor:pointer;line-height:1}
.stock output{min-width:30px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 12px;color:var(--soft);font-weight:800;background:#fff;border:2px dashed var(--line);border-radius:16px}
.panel{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;margin-top:6px}
.panel h2{margin:0;font:700 19px var(--display)}
.panel p{margin:0;color:var(--soft);font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .h{font-size:11px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.grid3 input{border:2px solid var(--line);border-radius:10px;padding:8px;min-width:0;width:100%}
.field{display:grid;gap:4px;font-size:13px;font-weight:900}
.field small{font-weight:700;color:var(--soft)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-weight:700}
.field input[type=color]{width:64px;height:44px;padding:3px;border-color:var(--ink)}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:900;cursor:pointer;background:#fff;width:100%;text-align:left}
.toggle i{width:44px;height:26px;border-radius:999px;background:#DDD3E8;position:relative;flex:none;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] i{background:var(--green)} .toggle[aria-pressed="true"] i::after{left:21px}
.seg{display:flex;gap:6px}.seg .btn{flex:1}.seg .btn[aria-pressed="true"]{background:var(--yellow)}
.colors{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.colors label{position:relative}
.colors input[type=color]{width:46px;height:46px;border:2px solid var(--ink);border-radius:50%;padding:0;background:none;cursor:pointer}
.colors input[type=color]::-webkit-color-swatch-wrapper{padding:0} .colors input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.colors .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:11px;font-weight:900;cursor:pointer;padding:0;line-height:1}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:88px;height:88px;border-radius:14px;background:#F4ECFA;overflow:hidden;display:grid;place-items:center;flex:none;color:var(--soft);font-size:12px;font-weight:800;text-align:center}
.photo .pv.round{border-radius:50%;border:2px solid var(--ink)}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.inlist{display:grid;gap:6px}
.inlist .it{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:13px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(42,22,56,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--bg);width:min(620px,100%);max-height:100%;overflow:auto;border-radius:22px 22px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:22px;max-height:92%}}
.sheet h2{margin:0;font:700 22px var(--display)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px}
.note{font-size:12.5px;color:var(--soft);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font-weight:900;padding:10px 16px;border-radius:12px;max-width:calc(100vw - 32px);text-align:center}
.hp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hp-card{background:#fff;border:2px solid var(--ink);border-radius:14px;overflow:hidden;display:grid}
.hp-card .im{aspect-ratio:1;background:#F4ECFA;display:grid;place-items:center;font-size:30px}
.hp-card .im img{width:100%;height:100%;object-fit:cover}
.hp-card div.t{padding:8px;font-weight:900;font-size:13px}
.hp-card div.t span{display:block;color:var(--cherry)}
.gate{max-width:420px;margin:60px auto;text-align:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px}

/* ---------- public site preview: hero (from Canva) + shop ---------- */
.hp{position:fixed;inset:0;z-index:80;overflow:auto;background:#2E8BE0;--mono:"IBM Plex Mono","Courier New",monospace;--glass:rgba(255,255,255,.22)}
.hp-close{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));border:2px solid var(--ink);border-radius:999px;background:#fff;padding:6px 14px;font:600 12px var(--mono);cursor:pointer;z-index:95}
.gl{background:var(--glass);border:1.5px solid rgba(255,255,255,.85);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.8),inset 0 -8px 16px rgba(120,180,255,.18),0 10px 24px rgba(10,50,120,.22)}
/* hero */
.hero{position:relative;height:100svh;min-height:560px;background:#2E8BE0 url("img/hero.jpg") center/cover;overflow:hidden}
.hero .logo{position:absolute;left:clamp(14px,3vw,40px);top:0;width:clamp(104px,12vw,170px);padding:clamp(22px,3vw,40px) clamp(18px,2.2vw,30px) clamp(26px,3vw,40px);border-radius:0 0 999px 999px;display:grid;place-items:center}
.hero .logo img{width:100%;height:auto;display:block}
.hero .nav{position:absolute;right:clamp(14px,3vw,40px);top:clamp(14px,4vh,40px);display:flex;gap:10px;align-items:center}
.pill{border-radius:999px;padding:12px 26px;font:500 clamp(14px,1.5vw,19px)/1 var(--mono);color:#10223f;cursor:pointer;letter-spacing:.02em}
.pill.w{color:#fff;text-shadow:0 1px 3px rgba(0,30,80,.5)}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:20px;position:relative}
.iconbtn .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:#FF4F9A;color:#fff;font:700 11px/20px var(--body);padding:0 5px}
.hero .ctas{position:absolute;left:clamp(14px,3vw,40px);bottom:clamp(16px,5vh,40px);display:flex;gap:16px;flex-wrap:wrap}
.hero .ctas .pill{padding:16px 30px;font-size:clamp(16px,2vw,26px);text-transform:uppercase}
.hero .doggy{position:absolute;right:clamp(14px,3vw,40px);bottom:clamp(16px,5vh,40px);width:clamp(110px,12vw,170px);border-radius:22px;padding:10px;cursor:pointer}
.hero .doggy img{width:100%;display:block}
.hero .doggy .dcap{display:block;margin-top:6px;font:600 12px/1.1 var(--mono);color:#fff;text-shadow:0 1px 3px rgba(0,30,80,.6);text-align:center}
@media (max-width:760px){.hero{background-image:url("img/hero-m.jpg")} .hero .ctas{left:50%;transform:translateX(-50%);justify-content:center;width:calc(100% - 32px);bottom:70px}
  .hero .ctas .pill{flex:1;padding:14px 10px;text-align:center;font-size:15px} .hero .nav .pill{display:none} .hero .doggy{top:clamp(14px,4vh,40px);bottom:auto;right:auto;left:auto;right:16px;transform:none;width:92px;padding:6px;border-radius:18px}}
/* shop */
.shop{min-height:100svh;background:url("img/hero.jpg") center/cover fixed;position:relative;padding-bottom:70px}
.shop::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.12);pointer-events:none}
.shop .top{position:sticky;top:0;z-index:5;background:linear-gradient(rgba(40,120,210,.55),rgba(40,120,210,0));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(14px,3vw,40px)}
.shop .top .lg{height:58px;width:auto;cursor:pointer;filter:drop-shadow(0 3px 6px rgba(10,40,100,.35))}
.shop .top .lg.dg{background:rgba(255,248,214,.9);border-radius:16px;padding:4px 10px;filter:drop-shadow(0 3px 6px rgba(10,40,100,.25))}
.hero .doggy{background:rgba(255,248,214,.55)}
.shop .top .tt{flex:1;min-width:0;text-align:center;font:400 clamp(22px,3vw,36px)/1 "Abril Fatface",Georgia,serif;color:#fff;text-shadow:0 2px 10px rgba(10,40,100,.45)}
.bubbles{position:relative;z-index:1;display:flex;gap:clamp(10px,1.6vw,22px);overflow-x:auto;padding:6px clamp(14px,3vw,40px) 14px;scrollbar-width:none;max-width:1280px;margin:0 auto}
.bub2{--s:clamp(70px,8vw,104px);flex:none;display:grid;justify-items:center;align-content:start;gap:6px;background:none;border:0;cursor:pointer;width:var(--s);color:#fff;font:700 13px/1.15 var(--body);text-shadow:0 1px 3px rgba(0,30,80,.6);text-align:center}
.bub2 .ring{width:var(--s);height:var(--s);flex:none;box-sizing:border-box;border-radius:50%;padding:4px;background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.35));box-shadow:0 8px 16px rgba(10,40,100,.25)}
.bub2 .ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#fff;font:400 26px var(--sign);color:#E63B2E}
.bub2 .ring > span{position:relative}
.bub2 .ring img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bub2[aria-pressed="true"] .ring{background:conic-gradient(#FF4F9A,#FFD23F,#3EC6FF,#B57BFF,#FF4F9A)}
.bsep{flex:none;width:2px;margin:10px 4px 26px;border-radius:2px;background:rgba(255,255,255,.7)}
.brandsw{flex:none;align-self:center;display:flex;align-items:center;gap:8px;border-radius:20px;padding:8px 14px 8px 8px;cursor:pointer;color:#fff;font:700 13px/1.15 var(--mono);text-align:left;text-shadow:0 1px 3px rgba(0,30,80,.6);background:linear-gradient(135deg,rgba(255,225,77,.45),rgba(255,141,192,.45))}
.brandsw img{height:52px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
@media (max-width:860px){.brandsw{order:-2}.bsep{order:-1}.brandsw img{height:44px}}
@media (max-width:480px){.shop .top .tt{visibility:hidden}.shop .top .lg{height:46px}}
.back{border-radius:999px;padding:9px 14px;font:600 13px var(--mono);color:#10223f;cursor:pointer;flex:none}
.bub2.make .ring span{background:linear-gradient(140deg,#FFE14D,#FF8DC0);font-size:30px}
.shopgrid{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 clamp(14px,3vw,40px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.stage{border-radius:28px;padding:14px;position:sticky;top:80px}
.stage .big{position:relative;border-radius:20px;display:grid;place-items:center;min-height:40vh;max-height:76svh;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.6),rgba(255,255,255,.15))}
.stage .big img{display:block;max-width:100%;max-height:74svh;width:auto;height:auto;object-fit:contain;border-radius:14px;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.94);opacity:.3}to{transform:none;opacity:1}}
.info{border-radius:24px;padding:18px;display:grid;gap:10px}
.info h1{margin:0;font:400 clamp(30px,3.4vw,46px)/1 "Abril Fatface",Georgia,serif;color:#fff;text-shadow:0 2px 10px rgba(10,40,100,.45)}
.info .pr{font:600 22px var(--mono);color:#fff;text-shadow:0 1px 4px rgba(10,40,100,.5)}
.info p{margin:0;color:#fff;font-weight:700;text-shadow:0 1px 4px rgba(10,40,100,.55)}
.info .stk{font:600 13px var(--mono);color:#fff}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.btnp{border:0;border-radius:999px;padding:14px 22px;font:700 15px var(--body);cursor:pointer;background:#FF4F9A;color:#fff;box-shadow:inset 0 2px 1px rgba(255,255,255,.5),0 8px 18px rgba(255,79,154,.35)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:4px}
.th{border:2px solid rgba(255,255,255,.8);border-radius:14px;background:rgba(255,255,255,.55);padding:4px;cursor:pointer;display:grid;gap:4px;color:var(--ink);text-align:left}
.th .im{aspect-ratio:3/4;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden}
.th .im img{width:100%;height:100%;object-fit:contain}
.th b{font:700 11.5px/1.15 var(--body);padding:0 2px} .th span{font:600 11px var(--mono);padding:0 2px 2px}
.th[aria-pressed="true"]{border-color:#FF4F9A;background:#fff;box-shadow:0 0 0 2px #FF4F9A}
.th.out{opacity:.5}
.emptyg{color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,30,80,.5);padding:30px 8px;text-align:center}
@media (max-width:860px){.shopgrid{grid-template-columns:1fr}.stage{top:64px;z-index:3;padding:8px}.stage .big{min-height:0;max-height:40svh}.stage .big img{max-height:38svh}.pstrip{margin-top:6px}.pstrip button{width:46px;height:46px}}
.btnp[disabled]{opacity:.5;cursor:not-allowed}
.btnp.wa{background:#25D366;box-shadow:inset 0 2px 1px rgba(255,255,255,.5),0 8px 18px rgba(37,211,102,.3)}
.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:400 30px/1 var(--body);color:var(--ink);cursor:pointer;box-shadow:0 6px 14px rgba(10,40,100,.25)}
.arr.l{left:10px} .arr.r{right:10px}
.idx{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font:600 12px var(--mono);background:rgba(255,255,255,.7);border-radius:999px;padding:3px 10px}
.sold{position:absolute;top:12px;left:12px;background:#D92D20;color:#fff;font:700 12px var(--mono);padding:4px 10px;border-radius:999px;z-index:2}
.arr{font-size:26px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.pstrip{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pstrip button{width:62px;height:62px;border-radius:12px;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.6);padding:2px;cursor:pointer;overflow:hidden}
.pstrip button img{width:100%;height:100%;object-fit:cover;border-radius:9px}
.pstrip button[aria-selected="true"]{border-color:#FF4F9A;box-shadow:0 0 0 2px #FF4F9A}
.ckf{max-width:440px;color:var(--ink)}
.ptab{display:grid;grid-template-columns:1.4fr repeat(5,minmax(70px,1fr)) 1.3fr;gap:6px 8px;align-items:center;overflow-x:auto}
.ptab .h{font:600 11px var(--body);color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.ptab input,.ptab select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit}
@media (max-width:760px){.ptab{grid-template-columns:repeat(7,110px)}}

#subnav.stack{display:grid;gap:8px;overflow:visible}
.subrow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0}
.subrow .lbl{flex:none;width:76px;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.gal{display:flex;flex-wrap:wrap;gap:8px}
.cropw{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.cpv{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--soft)}
.cpv span{display:block;width:90px;overflow:hidden;border-radius:10px;border:2px solid var(--ink);background:#eee}
.cpv span.round{border-radius:50%}
.cpv img{width:100%;height:100%;object-fit:cover;display:block}
.crop{position:relative;width:260px;max-width:100%;border-radius:10px;overflow:hidden;touch-action:none;cursor:grab;background:#ddd;line-height:0;user-select:none}
.crop img{width:100%;height:auto;display:block;pointer-events:none}
.crop .win{position:absolute;border:4px solid #fff;outline:2px dashed #6D28D9;outline-offset:-8px;border-radius:6px;box-shadow:0 0 0 9999px rgba(255,255,255,.62),0 0 0 4px rgba(0,0,0,.25);pointer-events:none}
.crop.moving{cursor:grabbing}
.pv.fpick{width:150px;height:150px;position:relative;cursor:crosshair;touch-action:none}
.pv.fpick img{object-fit:cover;pointer-events:none;user-select:none}
.fdot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #6D28D9,0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.opt2 .ph.cov img{object-fit:cover}
.gi.pick{padding:0}
.gi.pick[aria-pressed="true"]{outline:3px solid var(--purple,#6D28D9);outline-offset:1px}
.it.ord{display:flex;align-items:center;gap:8px}
.it.ord .mv{display:flex;gap:2px}
.it.ord .mv button{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.it.ord .mv button[disabled]{opacity:.3;cursor:default}
.pthumb{width:34px;height:34px;border-radius:6px;overflow:hidden;background:#F1F3F6;flex:none}
.pthumb img{width:100%;height:100%;object-fit:cover}
.gi{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;background:#F1F3F6;border:1px solid var(--line);display:grid;place-items:center;text-align:center;font-size:22px;color:var(--soft);cursor:pointer}
.gi img{width:100%;height:100%;object-fit:cover}
.gi .ga{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.45)}
.gi .ga button{flex:1;border:0;background:none;color:#fff;font-size:13px;padding:3px 0;cursor:pointer}
.gi.add small{font-size:10px}
.pbadge{margin-left:6px;background:#E11D48;color:#fff;border-radius:999px;padding:0 6px;font:700 11px/18px var(--body)}
.pedl{display:grid;gap:10px}
.ped{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;display:grid;gap:8px}
.ped .ph1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ped .pc{font:700 16px var(--mono, monospace);letter-spacing:.04em}
.ped .pd{margin-left:auto;color:var(--soft);font-size:12px}
.ped .ph2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.ped .ph2 a{color:#15803D;font-weight:600}
.ped .ptot{margin-left:auto;font:700 16px var(--body)}
.ped .pit{margin:0;padding:8px 10px;list-style:none;background:#F7F8FA;border-radius:8px;display:grid;gap:6px;font-size:13px}
.ped .pit > li > span{float:right;font-weight:600}
.ped .pit ul{margin:4px 0 0;padding-left:16px;color:#3B4252}
.ped .pacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ped .pacts input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
.ped .pacts select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.badge.st-nuevo{background:#FEE2E2;color:#B91C1C}.badge.st-confirmado{background:#DBEAFE;color:#1D4ED8}.badge.st-haciendo{background:#FEF3C7;color:#92400E}.badge.st-listo{background:#E0E7FF;color:#4338CA}.badge.st-entregado{background:#DCFCE7;color:#166534}.badge.st-cancelado{background:#F3F4F6;color:#6B7280}
.pinfo{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pinfo span{font:500 11px var(--body);padding:2px 7px;border-radius:6px;background:#F1F3F6;color:#3B4252;border:1px solid var(--line)}
.pinfo span.warn{background:#FFF4E5;color:#9A5B00;border-color:#FAD7A0}
.pinfo span.pr{background:#EEF6EE;color:#1E6B34;border-color:#C6E4CC;font-weight:600}
.hp{--body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;--display:"Fredoka","Arial Rounded MT Bold",sans-serif;font-family:var(--body)}

</style>

<div class="wrap">

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => n == null || n === "" ? "Consultar" : "$" + (Number.isInteger(+n) ? +n : (+n).toFixed(2));
const LOW = 3;
const MARCAS = { club: "Sugar Club", doggy: "Doggy Pops", match: "Match" };
const ICONS = ["estrella","corazon","cereza","hueso","nube","helado","sapo","florCristal","brillo"];
const INK = "#2A1638";
const ICON = {
  estrella:`<polygon points="0,-15 4.1,-5.7 14.3,-4.6 6.7,2.2 8.8,12.1 0,7 -8.8,12.1 -6.7,2.2 -14.3,-4.6 -4.1,-5.7" fill="#F5D738" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`,
  corazon:`<path d="M0,13 C-22,-1 -15,-18 0,-8 C15,-18 22,-1 0,13Z" fill="#E66A92" stroke="${INK}" stroke-width="2.5"/>`,
  cereza:`<path d="M-6,3 Q-3,-12 4,-16 Q4,-5 8,5" fill="none" stroke="#34A96A" stroke-width="3"/><circle cx="-7" cy="7" r="7" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle cx="8" cy="8" r="7" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/>`,
  hueso:`<path d="M-12,-4 a5,5 0 1 1 4,-6 h16 a5,5 0 1 1 4,6 a5,5 0 1 1 -4,6 h-16 a5,5 0 1 1 -4,-6z" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`,
  nube:`<path d="M-14,6 a7,7 0 0 1 2,-13 a9,9 0 0 1 16,-2 a7,7 0 0 1 10,9 a6,6 0 0 1 -4,6z" fill="#CDB6FF" stroke="${INK}" stroke-width="2.5"/>`,

  sapo:`<ellipse cy="4" rx="14" ry="10" fill="#6CCB7A" stroke="${INK}" stroke-width="2.5"/><circle cx="-7" cy="-6" r="5" fill="#6CCB7A" stroke="${INK}" stroke-width="2.5"/><circle cx="7" cy="-6" r="5" fill="#6CCB7A" stroke="${INK}" stroke-width="2.5"/>`,
  florCristal:`<circle cx="0" cy="-10" r="8" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle cx="9.5" cy="-3" r="8" fill="#9AA8F5" stroke="${INK}" stroke-width="2.5"/><circle cx="6" cy="8" r="8" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle cx="-6" cy="8" r="8" fill="#9AA8F5" stroke="${INK}" stroke-width="2.5"/><circle cx="-9.5" cy="-3" r="8" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle r="6.5" fill="#FF5A6E" stroke="${INK}" stroke-width="2"/>`,
  brillo:`<path d="M0,-17 Q3,-3 17,0 Q3,3 0,17 Q-3,3 -17,0 Q-3,-3 0,-17Z" fill="#FFE48A" stroke="${INK}" stroke-width="2.5"/>`
};
const iconSvg = id => `<svg viewBox="-20 -20 40 40" aria-hidden="true">${ICON[id] || ICON.estrella}</svg>`;
const blob = id => "/_blob/" + id;
const slug = s => (s || "item").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "item";
const catPos = c => { if (c?.iconoIdPos) return c.iconoIdPos; if (c?.iconoId || c?.iconoSrc) return "50% 50%"; const p = (S.data.productos || []).find(p => p.marca === c?.marca && p.categoria === c?.nombre && (p.fotoId || p.fotoSrc)); return p?.fotoIdPos || "50% 50%"; };
const posOf = (x, k = "fotoId") => (x && x[k + "Pos"]) || "50% 50%";
const catIcon = c => {
  if (c?.iconoId) return blob(c.iconoId);
  if (c?.iconoSrc) return c.iconoSrc;
  const p = (S.data.productos || []).find(p => p.marca === c?.marca && p.categoria === c?.nombre && (p.fotoId || p.fotoSrc));
  return p ? (p.fotoId ? blob(p.fotoId) : p.fotoSrc) : "";
};
const catTray = c => c?.bandejaId ? blob(c.bandejaId) : (c?.bandejaSrc || "");

/* ---------- what each list holds ---------- */
const SCHEMAS = {
  productos: {
    title: "producto", empty: "Aún no hay productos. Toca “+ Nuevo” para cargar el primero.",
    fields: [
      { k: "fotoId", t: "photo", label: "Foto (PNG sin fondo se ve mejor en la tienda)", fallback: "fotoSrc" },
      { k: "fotos", t: "photos", label: "Más fotos (opcional)", help: "Otros ángulos, puesto, detalle… Puedes subir varias a la vez. La foto principal es la de arriba." },
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "marca", t: "select", label: "Marca", opts: () => Object.entries(MARCAS) },
      { k: "categoria", t: "select", label: "Categoría *", opts: d => [["", "— elegir —"], ...catsDe(d.marca).map(c => [c.nombre, c.nombre])], when: d => d.marca !== "match", help: "Las categorías, con su ícono y texto, se editan en la pestaña Categorías." },
      { k: "descripcion", t: "textarea", label: "Descripción" },
      { k: "precio", t: "number", label: "Precio ($) *", help: "Obligatorio: sin precio el producto no sale en la tienda." },
      { k: "precioTexto", t: "text", label: "Cómo se muestra el precio (opcional)", help: "Ej.: $6 + $1 por letra" },
      { k: "opciones", t: "list", label: "Set: pares u opciones a elegir (opcional)", help: "Separa con comas, en orden de izquierda a derecha como en la foto. La clienta elige cuáles quiere y paga el Precio por cada uno. Ej.: Gota café, Carey, Negro" },
      { k: "incluye", t: "list", label: "Incluye", help: "Separa con comas. Ej.: Lazo humano, Lazo perrito", when: d => d.marca === "match" },
      { k: "stock", t: "number", label: "Stock", help: "Empieza en 1. En 0 se muestra Agotado. Vacío = hecho a pedido." },
      { k: "disponible", t: "toggle", label: "Visible en la web" },
      { k: "configurable", t: "toggle", label: "Es personalizable (abre un armador)", when: d => d.marca !== "match" },
      { k: "armador", t: "select", label: "¿Qué armador abre?", opts: () => [["collar", "Arma su collar"], ["llavero", "Arma tu llavero"]], when: d => d.configurable },
      { k: "matchy", t: "toggle", label: "Matchy: su collar + tu llavero a juego", when: d => d.configurable && d.armador !== "llavero" },
      { k: "estilo", t: "select", label: "Tipo de collar que abre", opts: () => [["", "— elegir —"], ...S.data.estilos.map(e => [e.id, e.nombre])], when: d => d.marca === "doggy" && d.configurable, help: "Al tocarlo en la tienda, se abre el armador con este tipo ya elegido." },
    ],
    nuevo: (tab, preset) => ({ nombre: "", marca: preset?.marca || (["club", "doggy", "match"].includes(tab) ? tab : "club"), categoria: preset?.categoria || "", descripcion: "", precio: null, stock: 1, disponible: true, ejemplo: false })
  },
  categorias: {
    title: "categoría", empty: "Aún no hay categorías.",
    fields: [
      { k: "nombre", t: "text", label: "Texto del botón", req: true },
      { k: "iconoId", t: "photo", label: "Ícono de la sección (miniatura)", fallback: "iconoSrc", help: "Si no subes uno, se usa la foto del primer producto de la categoría." },
      { k: "sub", t: "text", label: "Texto pequeño debajo (opcional)", help: "Ej.: nuevo, próximamente, marca hermana" },
      { k: "color", t: "color", label: "Color de respaldo (se ve si no hay ícono)" },
      { k: "marca", t: "select", label: "Marca", opts: () => [["club", "Sugar Club"], ["doggy", "Doggy Pops"]] },
      { k: "orden", t: "number", label: "Orden en el escritorio (1 = primero)" },
      { k: "disponible", t: "toggle", label: "Visible en el home" },
      { k: "bloqueada", t: "toggle", label: "Próximamente (no se puede abrir)" }
    ],
    nuevo: tab => ({ nombre: "", marca: tab === "doggy" ? "doggy" : "club", color: "#E63B2E", orden: 9, disponible: true, bloqueada: false, sub: "" })
  },
  cordones: {
    title: "cordón", empty: "Aún no hay cordones.",
    fields: [
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "tipo", t: "select", label: "Tipo", opts: () => [["Liso", "Liso (un color)"], ["Mezclado", "Mezclado (varios colores)"]] },
      { k: "colores", t: "colors", label: "Colores", help: "Toca un círculo para cambiar el color." },
      { k: "fotoId", t: "photo", label: "Foto del cordón (opcional)", help: "Si no subes foto, se dibuja con los colores." },
      { k: "stock", t: "number", label: "Stock (metros o rollos)", help: "En 0 no se ofrece en “Arma tu collar”." },
      { k: "disponible", t: "toggle", label: "Visible en “Arma tu collar”" }
    ],
    nuevo: () => ({ nombre: "", tipo: "Liso", colores: ["#F5A3C7"], stock: null, disponible: true })
  },
  charms: {
    title: "charm", empty: "Aún no hay charms.",
    fields: [
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "forma", t: "select", label: "¿Cómo va en el collar?", opts: () => [["colgante", "Colgante (cuelga del collar)"], ["cuenta", "Cuentita: bolita, donita o tallarín (va en el hilo, en pares)"]] },
      { k: "figura", t: "select", label: "Forma de la cuentita", opts: () => [["bolita", "Bolita"], ["dona", "Donita"], ["tallarin", "Tallarín (espiral)"], ["ruedita", "Ruedita"], ["corazon", "Corazoncito"]], when: d => d.forma === "cuenta", help: "Para dibujarla en el collar. El color no lo elige la clienta: se combina con su collar." },
      { k: "grupo", t: "text", label: "Grupo", help: "Ej.: Navidad, Frutas, Animalitos, Clásicos. Los charms del mismo grupo se muestran juntos." },
      { k: "popular", t: "toggle", label: "⭐ Más usado (sale primero)" },
      { k: "tipo", t: "select", label: "Tipo", opts: () => [["Charm Up", "Charm Up (normal)"], ["Sugar Premium", "Sugar Premium (hecho a mano)"]] },
      { k: "precio", t: "number", label: "Precio ($)" },
      { k: "stock", t: "number", label: "Stock", help: "En 0 no se ofrece en “Arma tu collar”." },
      { k: "fotoId", t: "photo", label: "Foto (opcional)" },
      { k: "icono", t: "select", label: "Dibujo si no hay foto", opts: () => ICONS.map(i => [i, i]) },
      { k: "disponible", t: "toggle", label: "Visible en “Arma tu collar”" }
    ],
    nuevo: () => ({ nombre: "", forma: "colgante", grupo: "", popular: false, tipo: "Charm Up", precio: 2, stock: null, icono: "estrella", disponible: true })
  },
  estilos: {
    title: "tipo de collar", empty: "Aún no hay tipos de collar.",
    fields: [
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "detalle", t: "text", label: "Detalle corto" },
      { k: "fotoId", t: "photo", label: "Foto de ejemplo", help: "Se muestra en el paso 1 de “Arma su collar”." },
      { k: "base", t: "number", label: "Precio base ($)" },
      { k: "porLetra", t: "number", label: "Precio por letra ($)" },
      { k: "tallaL", t: "number", label: "Precio talla L ($)", help: "Vacío = mismo precio." },
      { k: "maxLetras", t: "number", label: "Máx. letras" },
      { k: "orden", t: "number", label: "Orden" },
      { k: "disponible", t: "toggle", label: "Visible en “Arma tu collar”" }
    ],
    nuevo: () => ({ nombre: "", detalle: "", base: 10, porLetra: 0, tallaL: null, maxLetras: 10, orden: 9, disponible: true })
  },
  inspiracion: {
    title: "foto de inspiración", empty: "Aún no hay fotos. Sube fotos de collares reales que ya hiciste.",
    fields: [
      { k: "fotoId", t: "photo", label: "Foto", fallback: "fotoSrc" },
      { k: "nombre", t: "text", label: "Nombre del peludito", req: true },
      { k: "estilo", t: "select", label: "Tipo de collar", opts: () => S.data.estilos.map(e => [e.id, e.nombre]), help: "Al tocar “Quiero uno así”, abre el armador con este tipo." },
      { k: "nota", t: "text", label: "Detalle (opcional)", help: "Ej.: hilo arcoíris, cuentitas flor" },
      { k: "orden", t: "number", label: "Orden" },
      { k: "disponible", t: "toggle", label: "Visible en la galería" }
    ],
    nuevo: () => ({ nombre: "", estilo: "letras", nota: "", orden: 99, disponible: true })
  },
  colgadores: {
    title: "colgador", empty: "Aún no hay colgadores. Sube cada argolla, mosquetón o colgador con su foto.",
    fields: [
      { k: "fotoId", t: "photo", label: "Foto del colgador" },
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "grupo", t: "text", label: "Tipo", help: "Ej.: Argolla redonda, Ovalado con corazón. Los del mismo tipo salen juntos." },
      { k: "precio", t: "number", label: "Precio extra ($)", help: "Se suma al precio base del llavero. 0 = incluido." },
      { k: "stock", t: "number", label: "Stock" },
      { k: "disponible", t: "toggle", label: "Visible en “Arma tu llavero”" }
    ],
    nuevo: () => ({ nombre: "", precio: 0, stock: 1, disponible: true })
  },
  promos: {
    title: "promo", empty: "Aún no hay promos. Al terminar el collar, la clienta elige UN regalo gratis entre las promos activas.",
    fields: [
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "cat", t: "select", label: "¿Qué regalo es?", opts: () => [["", "Este mismo (ej. Sparkle Kit)"], ...catsDe("doggy").map(c => [c.nombre, "Uno a elegir de: " + c.nombre])], help: "Si eliges una categoría (ej. Bandanas), la clienta escoge cuál de esos productos quiere gratis." },
      { k: "descripcion", t: "textarea", label: "Descripción" },
      { k: "fotoId", t: "photo", label: "Foto (opcional)" },
      { k: "disponible", t: "toggle", label: "Promo activa" }
    ],
    nuevo: () => ({ nombre: "", tipo: "regalo", cat: "", descripcion: "", disponible: true })
  },
  placas: {
    title: "placa", empty: "Aún no hay placas.",
    fields: [
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "stock", t: "number", label: "Stock" },
      { k: "fotoId", t: "photo", label: "Foto (opcional)" },
      { k: "disponible", t: "toggle", label: "Visible en “Arma tu collar”" }
    ],
    nuevo: () => ({ nombre: "", stock: null, disponible: true })
  }
};

/* ---------- state ---------- */
const S = { tab: "productos", sub: "todo", cat: "", q: "", data: { productos: [], categorias: [], cordones: [], charms: [], placas: [], estilos: [], promos: [], colgadores: [], inspiracion: [] }, ajustes: null, loaded: new Set() };
let db = null, assets = null;
const catsDe = m => S.data.categorias.filter(c => c.marca === m).sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99) || (a.nombre || "").localeCompare(b.nombre || ""));
const prodsDe = c => S.data.productos.filter(p => p.marca === c.marca && p.categoria === c.nombre).sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999) || (a.nombre || "").localeCompare(b.nombre || ""));

/* ---------- status + toast ---------- */
let pending = 0;
function status(kind, txt) { const s = $("#status"); s.className = "status " + (kind || ""); s.textContent = txt; }
function saving(p) {
  pending++; status("saving", "Guardando…");
  return p.then(r => { if (--pending === 0) status("", "Guardado ✓"); return r; })

async function moveProd(id, dir) {

  [ps[i], ps[j]] = [ps[j], ps[i]];
  const changed = ps.map((p, n) => ({ p, n: n + 1 })).filter(x => x.p.orden !== x.n);
  changed.forEach(x => x.p.orden = x.n);
  drawEditor();
  try { await saving(Promise.all(changed.map(x => db.doc("productos/" + x.p.id).update({ orden: x.n })))); } catch (e) {}
}
async function uploadMany(k, files) {

  ed.data[k] = ed.data[k] || [];
  for (const file of files) {

    try { const r = await saving(assets.upload(file)); ed.data[k].push(r.id); ed.added.push(r.id); } catch (e) {}

}
async function upload(k, file) {

  const btn = $(`label[for=up_${k}]`); if (btn) btn.textContent = "Subiendo…";

function closeEditor() {

async function save() {
  const d = ed.data, col = ed.col;
  if (!String(d.nombre || "").trim()) return toast("Ponle un nombre");
  if (col === "productos" && d.marca !== "match" && !d.categoria) return toast("Elige la categoría");
  if (col === "productos" && !d.configurable && (d.precio == null || d.precio === "" || isNaN(+d.precio))) return toast("Ponle un precio: es obligatorio");
  if (col === "productos") delete d.ejemplo;
  d.nombre = d.nombre.trim();
  for (const [k, v] of Object.entries(ed.newPhotos)) d[k] = v || null;
  if (col === "categorias" && S.data.categorias.some(c => c.id !== ed.id && c.marca === d.marca && c.nombre.toLowerCase() === d.nombre.toLowerCase())) return toast("Ya existe una categoría con ese nombre");
  let id = ed.id;
  if (ed.isNew) { const base = (col === "productos" || col === "categorias" ? d.marca + "-" : "") + slug(d.nombre); id = base; let n = 2; while (S.data[col].some(x => x.id === id)) id = base + "-" + n++; }

    for (const x of ed.removed) if (x !== body.fotoId && !(body.fotos || []).includes(x)) assets?.delete(x).catch(() => {});
    ed.added = [];

      for (const p of S.data.productos.filter(p => p.marca === d.marca && p.categoria === ed.oldName)) await saving(db.doc("productos/" + p.id).update({ categoria: d.nombre }));
    }
    ed.newPhotos = {}; ed = null; $("#sheet").hidden = true; document.activeElement?.blur?.(); renderMain(); toast("Guardado");
  } catch (e) { const b = $("#saveBtn"); if (b) b.disabled = false; }
}

  if (g === "colAdd") { addToCart({ key: "col-" + Date.now(), nombre: `${col.matchy ? "Matchy" : "Collar"} ${cEstilo()?.nombre || ""} · ${nombreUsado() || "sin nombre"}`, detalle: colOrder().map(x => x.slice(2)).join(" · "), precio: colTotal(), precioTexto: money(colTotal()), img: itemImg(cEstilo()), marca: "doggy" }); return renderCollar(); }
  if (g === "colWa") return openCheckout([{ nombre: `${col.matchy ? "Matchy" : "Collar"} ${cEstilo()?.nombre || ""} · ${nombreUsado() || "sin nombre"}`, detalle: colOrder().map(x => x.slice(2)), q: 1, precio: colTotal() }], "doggy");
  if (g === "search") return openSearch();
  if (g === "closesearch") return $("#hpSearch")?.remove();
  if (g === "cart") return renderCart();
  if (g === "closecart") return $("#hpCart")?.remove();
  if (g === "wa") { const brands = new Set(cart.map(l => l.marca)); $("#hpCart")?.remove(); return openCheckout(cart.map(l => ({ nombre: l.nombre, detalle: l.detalle ? String(l.detalle).split(" · ") : [], q: l.q, precio: l.precio })), brands.size > 1 ? "mix" : [...brands][0], true); }
  if (g === "closeck") { $("#hpCheckout")?.remove(); return; }

});

/* ---------- boot ---------- */
(async () => {
  render();
  const timer = setTimeout(() => { if (!db) status("err", "Sin conexión"); }, 10000);
  db = await window.claude?.use?.("db");
  clearTimeout(timer);
  if (!db) { $("#main").innerHTML = `<div class="gate"><b>Abre este panel con tu cuenta de Claude.</b><p class="note">Desde aquí no se pueden ver ni guardar los productos.</p></div>`; status("err", "Sin acceso"); return; }
  status("", "Conectado");
  const who = await window.claude?.use?.("user"); whoUser = who;
  isEditor = (await who?.canEdit?.()) ?? false;
  if (!isEditor) { document.querySelector("body > .wrap")?.setAttribute("hidden", ""); openHome(); }
  for (const col of ["productos", "categorias", "cordones", "charms", "placas", "estilos", "promos", "colgadores", "inspiracion"]) {
    db.collection(col).onSnapshot(snap => {
      S.data[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded.add(col); if (!ed && viewCols().includes(col) && !document.activeElement?.closest("form")) renderMain();
    }, () => status("err", "Error al cargar"));
  }
  if (isEditor) db.collection("pedidos").onSnapshot(snap => {
    S.rawPed = {}; snap.docs.forEach(d => S.rawPed[d.id] = { ...(d.data().ordenes || {}) });
    S.data.pedidos = Object.entries(S.rawPed).flatMap(([uid, o]) => Object.entries(o).map(([k, v]) => ({ ...v, id: k, _uid: uid }))); S.loaded.add("pedidos");
    const n = S.data.pedidos.filter(p => p.estado === "nuevo").length, b = $("#pBadge"); if (b) { b.hidden = !n; b.textContent = n; }
    if (S.tab === "pedidos") { renderHeader(); if (!document.activeElement?.closest("[data-pnota]")) renderMain(); }
  }, () => {});
  db.doc("ajustes/general").onSnapshot(snap => { S.ajustes = snap.exists ? snap.data() : {}; if (!ed && viewCols().includes("ajustes") && !document.activeElement?.closest("form")) renderMain(); }, () => {});
  assets = await window.claude?.use?.("assets");
})();
</script>
