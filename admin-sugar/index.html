<title>Sugar Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: a back-office for one person on a phone — sticky header, three tabs, long scannable lists, full-screen editor sheet. Sugar pastel world, single theme by choice. */
:root{
  --bg:#FFF8E4; --card:#FFFFFF; --ink:#2A1638; --soft:#6B5A78; --line:#E9DFF3;
  --pink:#E66A92; --cherry:#E63B2E; --yellow:#F5D738; --blue:#3E9AD6; --green:#34A96A; --purple:#7B3AF5;
  --ok:#1F8A4C; --warn:#C2410C;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font:700 26px/1 var(--display)}
h1 span{color:var(--pink)}
.status{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:#fff;border:2px solid var(--line);white-space:nowrap}
.status.saving{border-color:var(--yellow)} .status.err{border-color:var(--cherry);color:var(--cherry)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:9px 4px;font-weight:900;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 13px;font-weight:900;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--yellow)}
.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff}
.btn{border:2px solid var(--ink);border-radius:12px;padding:9px 14px;font-weight:900;cursor:pointer;background:#fff;white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff}
.btn.danger{border-color:var(--cherry);color:var(--cherry)}
.btn.danger.sure{background:var(--cherry);color:#fff}
.summary{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:900;color:var(--soft)}
.summary b{color:var(--ink)}
.list{display:grid;gap:8px;margin-top:6px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;cursor:pointer}
.row:hover{border-color:var(--ink)}
.row.off{opacity:.55}
.thumb{width:56px;height:56px;border-radius:12px;background:#F4ECFA;display:grid;place-items:center;overflow:hidden;font-size:24px}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:44px;height:44px}
.info{min-width:0}
.info b{display:block;font:700 16px/1.15 var(--display);overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--soft);font-weight:800}
.price{font-weight:900}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.badge{font-size:10.5px;font-weight:900;border-radius:999px;padding:2px 7px;background:#F4ECFA}
.badge.out{background:#FDE2E0;color:var(--cherry)} .badge.low{background:#FFF0C2;color:#8A5A00} .badge.hid{background:#E8E8EE} .badge.ex{background:#E0EEFF}
.stock{display:flex;align-items:center;gap:4px}
.stock button{width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-weight:900;font-size:18px;cursor:pointer;line-height:1}
.stock output{min-width:30px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 12px;color:var(--soft);font-weight:800;background:#fff;border:2px dashed var(--line);border-radius:16px}
.panel{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;margin-top:6px}
.panel h2{margin:0;font:700 19px var(--display)}
.panel p{margin:0;color:var(--soft);font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .h{font-size:11px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.field{display:grid;gap:4px;font-size:13px;font-weight:900}
.field small{font-weight:700;color:var(--soft)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-weight:700}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:900;cursor:pointer;background:#fff;width:100%;text-align:left}
.toggle i{width:44px;height:26px;border-radius:999px;background:#DDD3E8;position:relative;flex:none;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] i{background:var(--green)} .toggle[aria-pressed="true"] i::after{left:21px}
.colors{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.colors label{position:relative}
.colors input[type=color]{width:46px;height:46px;border:2px solid var(--ink);border-radius:50%;padding:0;background:none;cursor:pointer}
.colors input[type=color]::-webkit-color-swatch-wrapper{padding:0} .colors input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.colors .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:11px;font-weight:900;cursor:pointer;padding:0;line-height:1}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:88px;height:88px;border-radius:14px;background:#F4ECFA;overflow:hidden;display:grid;place-items:center;flex:none;color:var(--soft);font-size:12px;font-weight:800;text-align:center}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(42,22,56,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--bg);width:min(620px,100%);max-height:100%;overflow:auto;border-radius:22px 22px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:22px;max-height:92%}}
.sheet h2{margin:0;font:700 22px var(--display)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px}
.note{font-size:12.5px;color:var(--soft);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:900;padding:10px 16px;border-radius:12px;max-width:calc(100vw - 32px);text-align:center}
.gate{max-width:420px;margin:60px auto;text-align:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="hrow"><h1>Sugar <span>Admin</span></h1><span class="status" id="status" role="status">Conectando…</span></div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button type="button" role="tab" data-tab="productos" aria-selected="true">Productos</button>
      <button type="button" role="tab" data-tab="collar" aria-selected="false">Arma tu collar</button>
      <button type="button" role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
    </nav>
    <div class="sub" id="subnav"></div>
    <div class="tools" id="tools"></div>
  </header>
  <main id="main"><div class="empty">Cargando tu tienda…</div></main>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="sheetCard" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => n == null || n === "" ? "Consultar" : "$" + (Number.isInteger(+n) ? +n : (+n).toFixed(2));
const LOW = 3;
const MARCAS = { club: "Sugar Club", doggy: "Doggy Pops", match: "Match" };
const ICONS = ["estrella","corazon","cereza","hueso","nube","helado","sapo","florCristal","brillo"];
const INK = "#2A1638";
const ICON = {
  estrella:`<polygon points="0,-15 4.1,-5.7 14.3,-4.6 6.7,2.2 8.8,12.1 0,7 -8.8,12.1 -6.7,2.2 -14.3,-4.6 -4.1,-5.7" fill="#F5D738" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`,
  corazon:`<path d="M0,13 C-22,-1 -15,-18 0,-8 C15,-18 22,-1 0,13Z" fill="#E66A92" stroke="${INK}" stroke-width="2.5"/>`,
  cereza:`<path d="M-6,3 Q-3,-12 4,-16 Q4,-5 8,5" fill="none" stroke="#34A96A" stroke-width="3"/><circle cx="-7" cy="7" r="7" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle cx="8" cy="8" r="7" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/>`,
  hueso:`<path d="M-12,-4 a5,5 0 1 1 4,-6 h16 a5,5 0 1 1 4,6 a5,5 0 1 1 -4,6 h-16 a5,5 0 1 1 -4,-6z" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`,
  nube:`<path d="M-14,6 a7,7 0 0 1 2,-13 a9,9 0 0 1 16,-2 a7,7 0 0 1 10,9 a6,6 0 0 1 -4,6z" fill="#CDB6FF" stroke="${INK}" stroke-width="2.5"/>`,
  helado:`<path d="M-8,-1 L0,17 L8,-1Z" fill="#E9B872" stroke="${INK}" stroke-width="2.5"/><circle cy="-6" r="10" fill="#F7A8C9" stroke="${INK}" stroke-width="2.5"/>`,
  sapo:`<ellipse cy="4" rx="14" ry="10" fill="#6CCB7A" stroke="${INK}" stroke-width="2.5"/><circle cx="-7" cy="-6" r="5" fill="#6CCB7A" stroke="${INK}" stroke-width="2.5"/><circle cx="7" cy="-6" r="5" fill="#6CCB7A" stroke="${INK}" stroke-width="2.5"/>`,
  florCristal:`<circle cx="0" cy="-10" r="8" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle cx="9.5" cy="-3" r="8" fill="#9AA8F5" stroke="${INK}" stroke-width="2.5"/><circle cx="6" cy="8" r="8" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle cx="-6" cy="8" r="8" fill="#9AA8F5" stroke="${INK}" stroke-width="2.5"/><circle cx="-9.5" cy="-3" r="8" fill="#E63B2E" stroke="${INK}" stroke-width="2.5"/><circle r="6.5" fill="#FF5A6E" stroke="${INK}" stroke-width="2"/>`,
  brillo:`<path d="M0,-17 Q3,-3 17,0 Q3,3 0,17 Q-3,3 -17,0 Q-3,-3 0,-17Z" fill="#FFE48A" stroke="${INK}" stroke-width="2.5"/>`
};
const iconSvg = id => `<svg viewBox="-20 -20 40 40" aria-hidden="true">${ICON[id] || ICON.estrella}</svg>`;
const photoUrl = id => id ? "/_blob/" + id : "";
const slug = s => (s || "item").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "item";

/* ---------- what each list holds ---------- */
const SCHEMAS = {
  productos: {
    title: "producto", empty: "Aún no hay productos. Toca “+ Nuevo” para cargar el primero.",
    fields: [
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "marca", t: "select", label: "Marca", opts: () => Object.entries(MARCAS) },
      { k: "categoria", t: "select", label: "Categoría", opts: d => categoriasDe(d.marca).map(c => [c, c]), when: d => d.marca !== "match", help: "Las categorías se editan en Ajustes." },
      { k: "descripcion", t: "textarea", label: "Descripción" },
      { k: "precio", t: "number", label: "Precio ($)", help: "Vacío = “Consultar precio”." },
      { k: "precioTexto", t: "text", label: "Cómo se muestra el precio (opcional)", help: "Ej.: $6 + $1 por letra" },
      { k: "incluye", t: "list", label: "Incluye", help: "Separa con comas. Ej.: Lazo humano, Lazo perrito", when: d => d.marca === "match" },
      { k: "stock", t: "number", label: "Stock", help: "En 0 se muestra Agotado. Vacío = hecho a pedido." },
      { k: "fotoId", t: "photo", label: "Foto" },
      { k: "disponible", t: "toggle", label: "Visible en la web" },
      { k: "configurable", t: "toggle", label: "Mostrar botón “Arma el tuyo”", when: d => d.marca === "doggy" },
      { k: "ejemplo", t: "toggle", label: "Es un producto de ejemplo" }
    ],
    nuevo: tab => ({ nombre: "", marca: tab === "todo" ? "doggy" : tab, categoria: "", descripcion: "", precio: null, stock: null, disponible: true, ejemplo: false })
  },
  cordones: {
    title: "cordón", empty: "Aún no hay cordones.",
    fields: [
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "tipo", t: "select", label: "Tipo", opts: () => [["Liso", "Liso (un color)"], ["Mezclado", "Mezclado (varios colores)"]] },
      { k: "colores", t: "colors", label: "Colores", help: "Toca un círculo para cambiar el color." },
      { k: "stock", t: "number", label: "Stock (metros o rollos)", help: "En 0 no se ofrece en “Arma tu collar”." },
      { k: "disponible", t: "toggle", label: "Visible en “Arma tu collar”" }
    ],
    nuevo: () => ({ nombre: "", tipo: "Liso", colores: ["#F5A3C7"], stock: null, disponible: true })
  },
  charms: {
    title: "charm", empty: "Aún no hay charms.",
    fields: [
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "tipo", t: "select", label: "Tipo", opts: () => [["Charm Up", "Charm Up (normal)"], ["Sugar Premium", "Sugar Premium (hecho a mano)"]] },
      { k: "precio", t: "number", label: "Precio ($)" },
      { k: "stock", t: "number", label: "Stock", help: "En 0 no se ofrece en “Arma tu collar”." },
      { k: "fotoId", t: "photo", label: "Foto (opcional)" },
      { k: "icono", t: "select", label: "Dibujo si no hay foto", opts: () => ICONS.map(i => [i, i]) },
      { k: "disponible", t: "toggle", label: "Visible en “Arma tu collar”" }
    ],
    nuevo: () => ({ nombre: "", tipo: "Charm Up", precio: 2, stock: null, icono: "estrella", disponible: true })
  },
  placas: {
    title: "placa", empty: "Aún no hay placas.",
    fields: [
      { k: "nombre", t: "text", label: "Nombre", req: true },
      { k: "stock", t: "number", label: "Stock" },
      { k: "fotoId", t: "photo", label: "Foto (opcional)" },
      { k: "disponible", t: "toggle", label: "Visible en “Arma tu collar”" }
    ],
    nuevo: () => ({ nombre: "", stock: null, disponible: true })
  }
};

/* ---------- state ---------- */
const S = { tab: "productos", sub: "todo", q: "", data: { productos: [], cordones: [], charms: [], placas: [], estilos: [] }, ajustes: null, loaded: new Set() };
let db = null, assets = null;
const categoriasDe = m => (S.ajustes?.categorias?.[m]) || [];

/* ---------- status + toast ---------- */
let pending = 0;
function status(kind, txt) { const s = $("#status"); s.className = "status " + (kind || ""); s.textContent = txt; }
function saving(p) {
  pending++; status("saving", "Guardando…");
  return p.then(r => { if (--pending === 0) status("", "Guardado ✓"); return r; })
          .catch(e => { pending--; status("err", "No se guardó"); toast(errMsg(e)); throw e; });
}
const errMsg = e => ({ not_granted: "No tienes permiso para editar.", quota_exceeded: "Se llenó el espacio. Borra algo que no uses.", too_large: "La foto pesa demasiado (máx. 20 MB).", unsupported_type: "Usa una foto JPG, PNG o WebP." }[e?.code] || "No se pudo guardar. Revisa tu conexión e inténtalo otra vez.");
let tt; function toast(m) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200); }

/* ---------- rendering ---------- */
function stockBadge(it) {
  if (it.disponible === false) return `<span class="badge hid">Oculto</span>`;
  if (it.stock === 0) return `<span class="badge out">Agotado</span>`;
  if (typeof it.stock === "number" && it.stock <= LOW) return `<span class="badge low">Quedan ${it.stock}</span>`;
  return "";
}
function thumb(it, col) {
  if (it.fotoId) return `<div class="thumb"><img src="${esc(photoUrl(it.fotoId))}" alt="" loading="lazy"></div>`;
  if (col === "cordones") { const c = it.colores?.length ? it.colores : ["#ddd"]; return `<div class="thumb" style="background:linear-gradient(135deg,${c.map((x, i) => `${x} ${i * 100 / c.length}% ${(i + 1) * 100 / c.length}%`).join(",")})"></div>`; }
  if (col === "charms") return `<div class="thumb">${iconSvg(it.icono)}</div>`;
  return `<div class="thumb" aria-hidden="true">${{ club: "🍒", doggy: "🐶", match: "💞" }[it.marca] || "🦴"}</div>`;
}
function row(it, col) {
  const metaTxt = col === "productos" ? `${MARCAS[it.marca] || ""}${it.categoria ? " · " + it.categoria : ""}` : col === "cordones" ? it.tipo : col === "charms" ? it.tipo : "";
  const priceTxt = col === "productos" ? (it.precioTexto || money(it.precio)) : col === "charms" ? money(it.precio) : "";
  const st = typeof it.stock === "number" ? it.stock : null;
  return `<div class="row ${it.disponible === false ? "off" : ""}" data-col="${col}" data-id="${esc(it.id)}">
    ${thumb(it, col)}
    <div class="info"><b>${esc(it.nombre || "Sin nombre")}</b><div class="meta">${esc(metaTxt)}${priceTxt ? ` · <span class="price">${esc(priceTxt)}</span>` : ""}</div>
      <div class="badges">${stockBadge(it)}${it.ejemplo ? '<span class="badge ex">Ejemplo</span>' : ""}</div></div>
    <div class="stock" data-stock>${st === null ? `<button type="button" class="btn" data-setstock style="width:auto;height:auto;font-size:12px;padding:6px 8px">+ stock</button>` :
      `<button type="button" data-step="-1" aria-label="Restar 1">−</button><output>${st}</output><button type="button" data-step="1" aria-label="Sumar 1">+</button>`}</div>
  </div>`;
}
function renderHeader() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  const sub = $("#subnav"), tools = $("#tools");
  if (S.tab === "productos") {
    sub.innerHTML = [["todo", "Todos"], ...Object.entries(MARCAS)].map(([k, v]) => `<button type="button" class="chip" data-sub="${k}" aria-pressed="${S.sub === k}">${v}</button>`).join("");
    tools.innerHTML = `<input type="search" id="q" placeholder="Buscar producto…" value="${esc(S.q)}" aria-label="Buscar"><button type="button" class="btn pri" data-new="productos">+ Nuevo</button>`;
  } else if (S.tab === "collar") {
    sub.innerHTML = [["cordones", "Cordones"], ["charms", "Charms"], ["placas", "Placas"], ["precios", "Precios"]].map(([k, v]) => `<button type="button" class="chip" data-sub="${k}" aria-pressed="${S.sub === k}">${v}</button>`).join("");
    tools.innerHTML = S.sub !== "precios" ? `<input type="search" id="q" placeholder="Buscar…" value="${esc(S.q)}" aria-label="Buscar"><button type="button" class="btn pri" data-new="${S.sub}">+ Nuevo</button>` : "";
  } else { sub.innerHTML = ""; tools.innerHTML = ""; }
  const q = $("#q"); if (q) q.oninput = e => { S.q = e.target.value; renderMain(); };
}
function renderMain() {
  const m = $("#main");
  if (S.tab === "ajustes") return renderAjustes(m);
  if (S.tab === "collar" && S.sub === "precios") return renderPrecios(m);
  const col = S.tab === "productos" ? "productos" : S.sub;
  if (!S.loaded.has(col)) { m.innerHTML = `<div class="empty">Cargando…</div>`; return; }
  let items = S.data[col].slice();
  if (col === "productos" && S.sub !== "todo") items = items.filter(p => p.marca === S.sub);
  const q = S.q.trim().toLowerCase();
  if (q) items = items.filter(p => (p.nombre + " " + (p.categoria || "") + " " + (p.tipo || "")).toLowerCase().includes(q));
  items.sort((a, b) => (a.marca || "").localeCompare(b.marca || "") || (a.categoria || a.tipo || "").localeCompare(b.categoria || b.tipo || "") || (a.nombre || "").localeCompare(b.nombre || ""));
  const out = items.filter(i => i.stock === 0).length, low = items.filter(i => typeof i.stock === "number" && i.stock > 0 && i.stock <= LOW).length;
  m.innerHTML = `<div class="summary"><span><b>${items.length}</b> ${col}</span>${out ? `<span>· <b>${out}</b> agotados</span>` : ""}${low ? `<span>· <b>${low}</b> por acabarse</span>` : ""}</div>` +
    (items.length ? `<div class="list">${items.map(i => row(i, col)).join("")}</div>` : `<div class="empty">${q ? "No hay resultados para esa búsqueda." : SCHEMAS[col].empty}</div>`);
}
function renderPrecios(m) {
  const E = S.data.estilos.slice().sort((a, b) => (a.orden || 0) - (b.orden || 0)), A = S.ajustes || {};
  const L = A.llavero || {}, N = A.numeroAtras || {};
  m.innerHTML = `<form class="panel" id="preciosForm">
    <h2>Precios de los collares</h2><p>Lo que cobra “Arma tu collar”. Talla L vacío = mismo precio.</p>
    <div class="grid3"><span class="h">Collar</span><span class="h">Base · por letra</span><span class="h">Talla L</span>
    ${E.map(e => `<b>${esc(e.nombre)}</b><div style="display:flex;gap:4px"><input class="fld" aria-label="Base ${esc(e.nombre)}" data-e="${e.id}" data-k="base" type="number" step="0.5" min="0" value="${e.base ?? ""}" style="width:50%;border:2px solid var(--line);border-radius:10px;padding:8px"><input aria-label="Por letra ${esc(e.nombre)}" data-e="${e.id}" data-k="porLetra" type="number" step="0.5" min="0" value="${e.porLetra ?? ""}" style="width:50%;border:2px solid var(--line);border-radius:10px;padding:8px"></div><input aria-label="Talla L ${esc(e.nombre)}" data-e="${e.id}" data-k="tallaL" type="number" step="0.5" min="0" value="${e.tallaL ?? ""}" style="border:2px solid var(--line);border-radius:10px;padding:8px;min-width:0">`).join("")}</div>
    <h2>Llavero match</h2>
    <div class="grid3"><label class="field">Con collar de placa<input id="llPlaca" type="number" step="0.5" min="0" value="${L.conPlaca ?? ""}"></label><label class="field">Base<input id="llBase" type="number" step="0.5" min="0" value="${L.base ?? ""}"></label><label class="field">Por letra<input id="llLetra" type="number" step="0.5" min="0" value="${L.porLetra ?? ""}"></label></div>
    <div class="grid3"><label class="field">Número atrás<input id="numAtras" type="number" step="0.5" min="0" value="${N.precio ?? ""}"></label><label class="field">Máx. charms<input id="maxCh" type="number" min="1" value="${A.maxCharms ?? 4}"></label><label class="field">Máx. cordones<input id="maxCo" type="number" min="1" value="${A.maxCordones ?? 2}"></label></div>
    <button type="submit" class="btn pri">Guardar precios</button></form>`;
  $("#preciosForm").onsubmit = async ev => {
    ev.preventDefault();
    const num = v => v === "" ? null : +v;
    try {
      for (const e of E) {
        const upd = {}; m.querySelectorAll(`[data-e="${e.id}"]`).forEach(i => upd[i.dataset.k] = num(i.value));
        if (upd.base == null) upd.base = 0; if (upd.porLetra == null) upd.porLetra = 0;
        if (JSON.stringify(upd) !== JSON.stringify({ base: e.base, porLetra: e.porLetra, tallaL: e.tallaL ?? null })) await saving(db.doc("estilos/" + e.id).update(upd));
      }
      await saving(db.doc("ajustes/general").update({ llavero: { conPlaca: num($("#llPlaca").value), base: num($("#llBase").value), porLetra: num($("#llLetra").value) }, numeroAtras: { precio: num($("#numAtras").value) ?? 0, soloEn: "placa" }, maxCharms: num($("#maxCh").value) || 4, maxCordones: num($("#maxCo").value) || 2 }));
      toast("Precios guardados");
    } catch (e) {}
  };
}
function renderAjustes(m) {
  const A = S.ajustes || {}, ig = A.instagram || {}, cats = A.categorias || {};
  m.innerHTML = `<form class="panel" id="ajForm">
    <h2>WhatsApp e Instagram</h2>
    <label class="field">Número de WhatsApp (el mismo para las dos marcas)<input id="wa" inputmode="tel" placeholder="593991234567" value="${esc(A.whatsapp || "")}"><small>Formato: 593 + tu número sin el 0. Ej.: 0991234567 → 593991234567</small></label>
    <div class="grid3" style="grid-template-columns:1fr 1fr"><label class="field">Instagram Sugar Club<input id="igClub" value="${esc(ig.club || "")}"></label><label class="field">Instagram Doggy Pops<input id="igDoggy" value="${esc(ig.doggy || "")}"></label></div>
    <h2>Categorías</h2><p>Separa con comas. Son los filtros del catálogo.</p>
    <label class="field">Sugar Club<input id="catClub" value="${esc((cats.club || []).join(", "))}"></label>
    <label class="field">Doggy Pops<input id="catDoggy" value="${esc((cats.doggy || []).join(", "))}"></label>
    <button type="submit" class="btn pri">Guardar ajustes</button></form>`;
  $("#ajForm").onsubmit = async ev => {
    ev.preventDefault();
    const list = v => v.split(",").map(s => s.trim()).filter(Boolean);
    const wa = $("#wa").value.replace(/\D/g, "");
    if (wa && !/^593\d{8,9}$/.test(wa)) { toast("Revisa el número: debe empezar con 593"); return; }
    try { await saving(db.doc("ajustes/general").update({ whatsapp: wa, instagram: { club: $("#igClub").value.trim().replace(/^@/, ""), doggy: $("#igDoggy").value.trim().replace(/^@/, "") }, categorias: { club: list($("#catClub").value), doggy: list($("#catDoggy").value) } })); toast("Ajustes guardados"); } catch (e) {}
  };
}
function viewCols() {
  if (S.tab === "productos") return ["productos"];
  if (S.tab === "ajustes") return ["ajustes"];
  return S.sub === "precios" ? ["estilos", "ajustes"] : [S.sub];
}
function render() { renderHeader(); renderMain(); }

/* ---------- editor sheet ---------- */
let ed = null; // {col, id, data, isNew, newPhoto, oldPhoto}
function openEditor(col, id) {
  const it = id ? S.data[col].find(x => x.id === id) : null;
  ed = { col, id, isNew: !it, data: structuredClone(it || SCHEMAS[col].nuevo(S.sub)), oldPhoto: it?.fotoId || null };
  if (col === "productos" && !ed.data.categoria && ed.data.marca !== "match") ed.data.categoria = categoriasDe(ed.data.marca)[0] || "";
  drawEditor(); $("#sheet").hidden = false;
}
function fieldHtml(f, d) {
  if (f.when && !f.when(d)) return "";
  const v = d[f.k], id = "f_" + f.k, help = f.help ? `<small>${esc(f.help)}</small>` : "";
  switch (f.t) {
    case "text": return `<label class="field" for="${id}">${f.label}<input id="${id}" data-k="${f.k}" value="${esc(v ?? "")}" ${f.req ? "required" : ""}>${help}</label>`;
    case "textarea": return `<label class="field" for="${id}">${f.label}<textarea id="${id}" data-k="${f.k}">${esc(v ?? "")}</textarea>${help}</label>`;
    case "number": return `<label class="field" for="${id}">${f.label}<input id="${id}" data-k="${f.k}" data-num type="number" inputmode="decimal" step="any" min="0" value="${v ?? ""}">${help}</label>`;
    case "list": return `<label class="field" for="${id}">${f.label}<input id="${id}" data-k="${f.k}" data-list value="${esc((v || []).join(", "))}">${help}</label>`;
    case "select": { const o = f.opts(d); const has = o.some(([k]) => k === v); return `<label class="field" for="${id}">${f.label}<select id="${id}" data-k="${f.k}">${has || v == null || v === "" ? "" : `<option value="${esc(v)}">${esc(v)}</option>`}${o.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>${help}</label>`; }
    case "toggle": return `<button type="button" class="toggle" data-toggle="${f.k}" aria-pressed="${v !== false && v !== undefined ? (v ? "true" : "false") : "false"}">${f.label}<i></i></button>`;
    case "colors": return `<div class="field">${f.label}<div class="colors">${(v || []).map((c, i) => `<label><input type="color" data-color="${i}" value="${esc(c)}" aria-label="Color ${i + 1}">${(v || []).length > 1 ? `<button type="button" class="x" data-rmcolor="${i}" aria-label="Quitar color">✕</button>` : ""}</label>`).join("")}<button type="button" class="btn" data-addcolor>+ color</button></div>${help}</div>`;
    case "photo": { const pid = ed.newPhoto !== undefined ? ed.newPhoto : v; return `<div class="field">${f.label}<div class="photo"><div class="pv">${pid ? `<img src="${esc(photoUrl(pid))}" alt="">` : "Sin foto"}</div>
      ${assets ? `<div style="display:grid;gap:6px"><label class="btn" for="up">${pid ? "Cambiar foto" : "Subir foto"}</label><input type="file" id="up" accept="image/jpeg,image/png,image/webp">${pid ? `<button type="button" class="btn" data-nophoto>Quitar foto</button>` : ""}</div>` : `<small>Las fotos solo se pueden subir con tu cuenta.</small>`}</div></div>`; }
  }
  return "";
}
function drawEditor() {
  const sch = SCHEMAS[ed.col], d = ed.data;
  $("#sheetCard").innerHTML = `<h2 id="sheetTitle">${ed.isNew ? "Nuevo " + sch.title : "Editar " + sch.title}</h2>
    <form id="edForm" style="display:grid;gap:12px">${sch.fields.map(f => fieldHtml(f, d)).join("")}
    <div class="acts">${ed.isNew ? "<span></span>" : `<button type="button" class="btn danger" id="delBtn">Eliminar</button>`}<span style="display:flex;gap:8px"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri" id="saveBtn">Guardar</button></span></div></form>`;
  const f = $("#edForm");
  f.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.color !== undefined) { d.colores[+t.dataset.color] = t.value; return; }
    if (!t.dataset.k) return;
    d[t.dataset.k] = t.dataset.num !== undefined ? (t.value === "" ? null : +t.value) : t.dataset.list !== undefined ? t.value.split(",").map(s => s.trim()).filter(Boolean) : t.value;
  });
  f.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "up" && t.files[0]) return upload(t.files[0]);
    if (t.dataset.k === "marca") { d.categoria = categoriasDe(d.marca)[0] || ""; drawEditor(); }
  });
  f.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.toggle) { d[b.dataset.toggle] = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", d[b.dataset.toggle]); }
    if (b.dataset.addcolor !== undefined) { d.colores = [...(d.colores || []), "#FFFFFF"]; drawEditor(); }
    if (b.dataset.rmcolor !== undefined) { d.colores.splice(+b.dataset.rmcolor, 1); drawEditor(); }
    if (b.dataset.nophoto !== undefined) { ed.newPhoto = null; drawEditor(); }
    if (b.dataset.close !== undefined) closeEditor();
    if (b.id === "delBtn") {
      if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Toca otra vez para eliminar"; return; }
      remove();
    }
  });
  f.onsubmit = e => { e.preventDefault(); save(); };
}
async function upload(file) {
  if (file.size > 20 * 1024 * 1024) return toast("La foto pesa demasiado (máx. 20 MB).");
  const btn = $("label[for=up]"); if (btn) btn.textContent = "Subiendo…";
  try { const r = await saving(assets.upload(file)); ed.newPhoto = r.id; drawEditor(); } catch (e) { drawEditor(); }
}
function closeEditor() {
  if (ed?.newPhoto && ed.newPhoto !== ed.oldPhoto) assets?.delete(ed.newPhoto).catch(() => {});
  ed = null; $("#sheet").hidden = true;
}
async function save() {
  const d = ed.data, col = ed.col;
  if (!String(d.nombre || "").trim()) return toast("Ponle un nombre");
  if (ed.newPhoto !== undefined) d.fotoId = ed.newPhoto || null;
  let id = ed.id;
  if (ed.isNew) { const base = (col === "productos" ? d.marca + "-" : "") + slug(d.nombre); id = base; let n = 2; while (S.data[col].some(x => x.id === id)) id = base + "-" + n++; }
  const body = { ...d, actualizado: Date.now() }; delete body.id;
  try {
    $("#saveBtn").disabled = true;
    await saving(db.doc(col + "/" + id).set(body));
    if (ed.oldPhoto && ed.oldPhoto !== body.fotoId) assets?.delete(ed.oldPhoto).catch(() => {});
    ed.newPhoto = undefined; ed = null; $("#sheet").hidden = true; toast("Guardado");
  } catch (e) { const b = $("#saveBtn"); if (b) b.disabled = false; }
}
async function remove() {
  const { col, id, oldPhoto } = ed;
  try { await saving(db.doc(col + "/" + id).delete()); if (oldPhoto) assets?.delete(oldPhoto).catch(() => {}); ed = null; $("#sheet").hidden = true; toast("Eliminado"); } catch (e) {}
}
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeEditor(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeEditor(); });

/* ---------- quick stock (one write per pause) ---------- */
const stockTimers = {};
function bumpStock(col, id, delta) {
  const it = S.data[col].find(x => x.id === id); if (!it) return;
  it.stock = Math.max(0, (typeof it.stock === "number" ? it.stock : 0) + delta);
  renderMain();
  clearTimeout(stockTimers[col + id]);
  stockTimers[col + id] = setTimeout(() => saving(db.doc(col + "/" + id).update({ stock: it.stock, actualizado: Date.now() })).catch(() => {}), 700);
}
$("#main").addEventListener("click", e => {
  const r = e.target.closest(".row"); if (!r) return;
  const st = e.target.closest("[data-stock]");
  if (st) {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.step) bumpStock(r.dataset.col, r.dataset.id, +b.dataset.step);
    if (b.dataset.setstock !== undefined) bumpStock(r.dataset.col, r.dataset.id, 1);
    return;
  }
  openEditor(r.dataset.col, r.dataset.id);
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t) { S.tab = t.dataset.tab; S.sub = S.tab === "productos" ? "todo" : S.tab === "collar" ? "cordones" : ""; S.q = ""; render(); return; }
  const s = e.target.closest("[data-sub]"); if (s) { S.sub = s.dataset.sub; S.q = ""; render(); return; }
  const n = e.target.closest("[data-new]"); if (n) openEditor(n.dataset.new, null);
});

/* ---------- boot ---------- */
(async () => {
  render();
  const timer = setTimeout(() => { if (!db) status("err", "Sin conexión"); }, 10000);
  db = await window.claude?.use?.("db");
  clearTimeout(timer);
  if (!db) { $("#main").innerHTML = `<div class="gate"><b>Abre este panel con tu cuenta de Claude.</b><p class="note">Desde aquí no se pueden ver ni guardar los productos.</p></div>`; status("err", "Sin acceso"); return; }
  status("", "Conectado");
  for (const col of ["productos", "cordones", "charms", "placas", "estilos"]) {
    db.collection(col).onSnapshot(snap => {
      S.data[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded.add(col); if (!ed && viewCols().includes(col) && !document.activeElement?.closest("form")) renderMain();
    }, () => status("err", "Error al cargar"));
  }
  db.doc("ajustes/general").onSnapshot(snap => { S.ajustes = snap.exists ? snap.data() : {}; if (!ed && viewCols().includes("ajustes") && !document.activeElement?.closest("form")) renderMain(); }, () => {});
  assets = await window.claude?.use?.("assets");
})();
</script>
