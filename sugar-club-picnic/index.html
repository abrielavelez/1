<title>Sugar Club Picnic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-width screen — Sugar's photo background edge to edge, the tray in the middle, section buttons stacked down the left and right edges, far from the center. Tap or drag a button onto the tray; a guest check prints the way in. Single bold theme by choice. */
:root{
  --cherry:#E63B2E; --rosa:#F2A0C8; --ink:#2A1638; --paper:#FFFDF6; --yellow:#F5D738; --white:#FFFFFF;
  --f-sign:"Bagel Fat One","Cooper Black","Arial Black",sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --f-body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow-x:clip}
body{margin:0;font:800 15px/1.3 var(--f-body);color:var(--ink);background:#7BC86C var(--bg-url,url("img/fondo-pasto.jpg")) center/cover fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.stage{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.top{text-align:center}
.logo{display:inline-block;background:var(--white);border-radius:999px;padding:6px 22px 10px;box-shadow:0 6px 0 rgba(42,22,56,.25)}
.logo b{font:400 clamp(30px,6vw,56px)/1 var(--f-sign);color:var(--cherry);letter-spacing:.01em}
.logo img{max-height:clamp(54px,9vw,96px);display:block}
.logo.has-img{background:none;box-shadow:none;padding:0}
.top p{margin:8px auto 0;display:table;background:var(--paper);padding:4px 14px 6px;border-radius:10px;font:700 clamp(19px,3.4vw,26px)/1 var(--f-hand);transform:rotate(-1.5deg);box-shadow:0 3px 0 rgba(42,22,56,.2)}

.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:clamp(8px,2.5vw,40px);min-height:0}
@media (min-width:900px){.board{grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:clamp(10px,2vh,22px);align-items:stretch}
.col.left{align-items:flex-start}
.col.right{align-items:flex-end}

.sec{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:flex;align-items:center;gap:10px;
  background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:6px 16px 6px 6px;box-shadow:0 5px 0 var(--ink);
  font:900 clamp(13px,1.6vw,18px)/1.05 var(--f-body);text-align:left;max-width:100%;transform:rotate(var(--r,0deg));transition:transform .15s}
.right .sec{flex-direction:row-reverse;padding:6px 6px 6px 16px;text-align:right}
.sec:hover{transform:rotate(var(--r,0deg)) translateY(-3px)}
.sec:active{cursor:grabbing}
.sec .pic{width:clamp(44px,6vw,74px);aspect-ratio:1;border-radius:50%;flex:none;overflow:hidden;background:var(--c,#F2A0C8);display:grid;place-items:center;border:2px solid var(--ink)}
.sec .pic img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.sec .pic .mono{font:400 clamp(20px,3vw,32px)/1 var(--f-sign);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.sec .txt{min-width:0;overflow-wrap:anywhere}
.sec .txt small{display:block;font:700 clamp(14px,1.6vw,19px)/1 var(--f-hand);color:var(--cherry);margin-top:2px}
.sec.locked{cursor:not-allowed;background:#F3EDF6;border-style:dashed}
.sec.gone{opacity:.25}
@media (max-width:620px){
  .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"c c" "l r";align-items:start;row-gap:34px}
  .center{grid-area:c} .col.left{grid-area:l} .col.right{grid-area:r}
  .col.left,.col.right{align-items:stretch}
  .sec,.right .sec{width:100%;padding:5px 10px 5px 5px;gap:8px;font-size:13px}
  .right .sec{padding:5px 5px 5px 10px}
  .sec .pic{width:42px}
}

.center{position:relative;display:grid;place-items:center;min-height:0}
.tray{position:relative;width:100%;max-width:760px;filter:drop-shadow(0 18px 22px rgba(60,10,30,.35))}
.tray > img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.tray.over{filter:drop-shadow(0 0 18px #fff) drop-shadow(0 0 8px var(--yellow))}
.tray.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.slot{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;pointer-events:none}
.slot img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));animation:land .45s cubic-bezier(.3,1.6,.5,1)}
.slot .chip{font:700 clamp(14px,2.4vw,24px)/1 var(--f-hand);background:var(--paper);padding:4px 8px;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.25);animation:land .45s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
@keyframes land{from{transform:scale(1.6) translateY(-30%);opacity:.3}to{transform:none;opacity:1}}
.hint{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,100%);white-space:nowrap;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font:900 clamp(11px,1.4vw,14px) var(--f-body);box-shadow:0 3px 0 var(--ink)}
.foot{text-align:center;font:700 clamp(17px,2.6vw,22px)/1 var(--f-hand);color:var(--ink);margin:0}
.foot span{background:var(--paper);padding:3px 12px 5px;border-radius:8px}

.ghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-50%) rotate(-5deg) scale(1.05);margin:0}
.ghost.fly{transition:all .42s cubic-bezier(.5,0,.7,1)}
.spark{position:fixed;z-index:31;pointer-events:none;font-size:22px;animation:spark .8s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(120deg);opacity:0}}

.check{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;width:min(340px,calc(100vw - 32px));transform:translate(-50%,130%) rotate(-2deg);
  transition:transform .55s cubic-bezier(.3,1.3,.5,1);background:var(--paper);padding:16px 16px 18px;box-shadow:0 14px 30px rgba(60,20,40,.4);
  -webkit-mask:radial-gradient(circle 6px at 50% 0,transparent 98%,#000) 0 0/16px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 0,transparent 98%,#000) 0 0/16px 100% repeat-x}
.check.show{transform:translate(-50%,0) rotate(-2deg)}
.check .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #9EC5E8;padding-bottom:4px;color:#2E5C8A;font:900 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase}
.check .hd span{color:var(--cherry);font-variant-numeric:tabular-nums}
.check .ln{display:flex;justify-content:space-between;font:700 25px/1.2 var(--f-hand);padding:8px 0 4px;border-bottom:1px solid #CFE1F1}
.check .thanks{font:700 22px/1 var(--f-hand);color:var(--cherry);margin:6px 0 10px}
.check .go{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:999px;background:var(--cherry);color:#fff;padding:12px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #9E1D14}
.check .later{display:block;width:100%;margin-top:8px;background:none;border:0;font-weight:900;font-size:13px;text-decoration:underline;cursor:pointer;color:#6B5A78}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:900;max-width:calc(100vw - 32px);text-align:center}
.editbar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;gap:8px}
.editbar button{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:8px 14px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.editbar button[aria-pressed="true"]{background:var(--ink);color:#fff}
body.editing .sec{outline:3px dashed #fff;outline-offset:4px;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(42,22,56,.5);display:flex;align-items:flex-end;justify-content:center}
.card{background:#FFF7FA;width:min(540px,100%);max-height:100%;overflow:auto;border-radius:22px 22px 0 0;display:grid;gap:12px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{align-items:center}.card{border-radius:22px}}
.card h2{margin:0;font:400 24px var(--f-sign);color:var(--cherry)}
.card p{margin:0;font-weight:700;font-size:13px;color:#6B5A78}
.fld{display:grid;gap:4px;font-weight:900;font-size:13px}
.fld input[type=text]{border:2px solid #E3D3E3;border-radius:12px;padding:10px 12px;font-weight:800;width:100%;min-width:0}
.fld input[type=color]{width:56px;height:40px;border:2px solid var(--ink);border-radius:10px;padding:2px;background:#fff}
.ph{display:flex;gap:10px;align-items:center}
.ph .pv{width:76px;height:76px;border-radius:12px;background:#EFE2EC;display:grid;place-items:center;overflow:hidden;font-size:11px;color:#6B5A78;text-align:center;flex:none}
.ph .pv img{width:100%;height:100%;object-fit:contain}
.ph input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.b{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:#fff;font-weight:900;cursor:pointer;font-size:13px}
.b.pri{background:var(--ink);color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .b{flex:1}.seg .b[aria-pressed="true"]{background:var(--rosa)}
.acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="stage">
  <header class="top">
    <div class="logo" id="logo"><b>Sugar Club</b></div>
    <p>Toca o arrastra una sección a la bandeja ✨</p>
  </header>
  <main class="board" aria-label="Secciones de Sugar Club">
    <nav class="col left" id="left" aria-label="Secciones"></nav>
    <div class="center"><div class="tray" id="tray"><img id="trayImg" src="img/bandeja.png" alt="Bandeja Sugar Club"><span class="hint" id="hint">suelta aquí ↓</span></div></div>
    <nav class="col right" id="right" aria-label="Más secciones"></nav>
  </main>
  <p class="foot"><span>Hecho a mano en Cuenca · envíos a todo Ecuador 🍒</span></p>
</div>

<aside class="check" id="check" aria-live="polite" aria-hidden="true"></aside>
<div class="sheet" id="sheet" hidden><div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const DOGGY_URL = "https://claude.ai/artifact/FkpBLWsjSidFPE8sWrbeUh";
const blob = id => "/_blob/" + id;

const SECTIONS = [
  { id: "bagcharms", label: "Bag charms", side: "left", color: "#E63B2E", src: "img/bagcharm-jackpot.webp", r: -2 },
  { id: "minifiguras", label: "Minifiguras", side: "left", color: "#F28A2E", r: 1.5 },
  { id: "rings", label: "Rings Pets", side: "left", color: "#E6407F", src: "img/rings-pets.webp", r: -1 },
  { id: "aretes", label: "Aretes", side: "left", color: "#8B5CF6", r: 2 },
  { id: "arma", label: "Arma tu charm", side: "left", color: "#9AA8F5", locked: true, sub: "próximamente", r: 0 },
  { id: "lazos", label: "Lazos", side: "right", color: "#F590BA", r: 2 },
  { id: "llaveros", label: "Llaveros", side: "right", color: "#3E9AD6", r: -1.5 },
  { id: "collares", label: "Collares", side: "right", color: "#C81D25", r: 1 },
  { id: "doggy", label: "Doggy Pops", side: "right", color: "#F5D738", src: "img/doggy-rocco.webp", link: DOGGY_URL, sub: "marca hermana", r: -2 }
];
/* compartment centers of the tray photo: x, y, size (% of the tray) */
const TRAY_SLOTS = [[78, 33, 26], [17, 63, 13], [41, 31, 13], [61, 79, 30], [17, 17, 11]];
const OTHER_SLOTS = [[35, 42, 24], [64, 42, 24], [50, 64, 24], [30, 68, 20], [70, 68, 20]];
const BACKGROUNDS = { cuadros: "img/fondo-cuadros.jpg", pasto: "img/fondo-pasto.jpg" };
let cfg = { items: {}, global: {} }, db = null, assets = null, ref = null, editing = false;
const S = id => ({ ...SECTIONS.find(s => s.id === id), ...(cfg.items[id] || {}) });

let tt; function toast(m) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); }

function secHtml(base) {
  const s = S(base.id), src = s.photoId ? blob(s.photoId) : s.src;
  const pic = src ? `<img src="${esc(src)}" alt="">` : `<span class="mono">${esc(s.label.charAt(0))}</span>`;
  return `<button type="button" class="sec ${s.locked ? "locked" : ""}" data-id="${s.id}" style="--c:${esc(s.color)};--r:${s.r || 0}deg" aria-label="${esc(s.label)}${s.locked ? " (próximamente)" : ""}">
    <span class="pic">${pic}</span><span class="txt">${esc(s.label)}${s.sub ? `<small>${esc(s.sub)}</small>` : ""}</span></button>`;
}
function render() {
  $("#left").innerHTML = SECTIONS.filter(s => S(s.id).side === "left").map(secHtml).join("");
  $("#right").innerHTML = SECTIONS.filter(s => S(s.id).side === "right").map(secHtml).join("");
  const g = cfg.global || {};
  document.body.style.setProperty("--bg-url", `url("${g.bgId ? blob(g.bgId) : BACKGROUNDS[g.bg || "pasto"]}")`);
  $("#trayImg").src = g.trayId ? blob(g.trayId) : "img/bandeja.png";
  const logo = $("#logo");
  logo.classList.toggle("has-img", !!g.logoId);
  logo.innerHTML = g.logoId ? `<img src="${esc(blob(g.logoId))}" alt="Sugar Club">` : `<b>Sugar Club</b>`;
}

/* ---------- drop on tray + guest check ---------- */
let orderNo = 143000 + Math.floor(Math.random() * 900), filled = 0;
function sparkle(x, y) {
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("span"); s.className = "spark"; s.textContent = ["✨", "⭐", "💖", "🍒"][i % 4];
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    s.style.left = x + "px"; s.style.top = y + "px"; s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 850);
  }
}
function placeInTray(s) {
  const slots = cfg.global?.trayId ? OTHER_SLOTS : TRAY_SLOTS, k = filled % slots.length, [x, y, w] = slots[k]; filled++;
  const tray = $("#tray"); tray.querySelector(`.slot[data-k="${k}"]`)?.remove();
  const src = s.photoId ? blob(s.photoId) : s.src;
  const el = document.createElement("div"); el.className = "slot"; el.dataset.k = k;
  el.style.left = x + "%"; el.style.top = y + "%"; el.style.width = w + "%"; el.style.height = w * 1.25 + "%";
  el.innerHTML = src ? `<img src="${esc(src)}" alt="">` : `<span class="chip">${esc(s.label)}</span>`;
  tray.appendChild(el);
}
function drop(btn, fromX, fromY) {
  const s = S(btn.dataset.id);
  if (s.locked) { btn.animate([{ transform: "rotate(-4deg)" }, { transform: "rotate(4deg)" }, { transform: "rotate(0)" }], { duration: 350 }); return toast("Arma tu charm llega muy pronto ✨"); }
  const t = $("#tray").getBoundingClientRect(), r = btn.getBoundingClientRect();
  const g = btn.cloneNode(true); g.classList.add("ghost"); g.style.width = r.width + "px";
  g.style.left = (fromX ?? r.left + r.width / 2) + "px"; g.style.top = (fromY ?? r.top + r.height / 2) + "px";
  document.body.appendChild(g); btn.classList.add("gone");
  requestAnimationFrame(() => requestAnimationFrame(() => { g.classList.add("fly"); g.style.left = t.left + t.width / 2 + "px"; g.style.top = t.top + t.height / 2 + "px"; g.style.opacity = ".15"; g.style.transform = "translate(-50%,-50%) scale(.5)"; }));
  setTimeout(() => {
    g.remove(); btn.classList.remove("gone");
    placeInTray(s);
    const tr = $("#tray"); tr.classList.remove("shake"); void tr.offsetWidth; tr.classList.add("shake");
    sparkle(t.left + t.width / 2, t.top + t.height / 2); $("#hint").hidden = true;
    showCheck(s);
  }, 440);
}
function showCheck(s) {
  const c = $("#check");
  c.innerHTML = `<div class="hd">Guest check <span>Nº ${++orderNo}</span></div>
    <div class="ln"><span>1 · ${esc(s.label)}</span><span>✓</span></div>
    <div class="thanks">gracias por pasar por el club ♡</div>
    ${s.link ? `<a class="go" href="${esc(s.link)}" target="_blank" rel="noopener">Ir a ${esc(s.label)} 🐶</a>` : `<button type="button" class="go" data-go>Ver ${esc(s.label)} →</button>`}
    <button type="button" class="later" data-later>Seguir mirando</button>`;
  c.classList.add("show"); c.setAttribute("aria-hidden", "false");
  c.querySelector("[data-go]")?.addEventListener("click", () => toast(`Siguiente paso: el catálogo de ${s.label}`));
  c.querySelector("[data-later]").addEventListener("click", hideCheck);
}
function hideCheck() { const c = $("#check"); c.classList.remove("show"); c.setAttribute("aria-hidden", "true"); }

let drag = null;
const board = document.querySelector(".board");
const overTray = (x, y) => { const b = $("#tray").getBoundingClientRect(); return x > b.left && x < b.right && y > b.top && y < b.bottom; };
board.addEventListener("pointerdown", e => {
  const btn = e.target.closest(".sec"); if (!btn || editing) return;
  drag = { btn, x0: e.clientX, y0: e.clientY, id: e.pointerId, ghost: null }; btn.setPointerCapture(e.pointerId);
});
board.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.ghost && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8 && !S(drag.btn.dataset.id).locked) {
    const r = drag.btn.getBoundingClientRect(), g = drag.btn.cloneNode(true); g.classList.add("ghost"); g.style.width = r.width + "px"; document.body.appendChild(g); drag.ghost = g; drag.btn.classList.add("gone");
  }
  if (drag.ghost) { drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px"; $("#tray").classList.toggle("over", overTray(e.clientX, e.clientY)); }
});
function end(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const { btn, ghost } = drag; drag = null; $("#tray").classList.remove("over");
  if (ghost) { ghost.remove(); btn.classList.remove("gone"); if (!cancel && overTray(e.clientX, e.clientY)) drop(btn, e.clientX, e.clientY); return; }
  if (!cancel) drop(btn);
}
board.addEventListener("pointerup", e => end(e, false));
board.addEventListener("pointercancel", e => end(e, true));
board.addEventListener("click", e => {
  const btn = e.target.closest(".sec"); if (!btn) return;
  if (editing) return openItem(btn.dataset.id);
  if (e.detail === 0) drop(btn);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { hideCheck(); closeSheet(); } });

/* ---------- owner editor ---------- */
let draft = null;
function phField(label, key, val, hint) {
  return `<div class="fld">${label}<div class="ph"><div class="pv">${val ? `<img src="${esc(blob(val))}" alt="">` : "Sin foto"}</div>
    <div style="display:grid;gap:6px"><label class="b" for="up-${key}">${val ? "Cambiar" : "Subir foto"}</label><input type="file" id="up-${key}" data-up="${key}" accept="image/png,image/jpeg,image/webp">${val ? `<button type="button" class="b" data-clear="${key}">Quitar</button>` : ""}</div></div>${hint ? `<p>${hint}</p>` : ""}</div>`;
}
function openItem(id) { const s = S(id); draft = { scope: "item", id, data: { label: s.label, photoId: s.photoId || null, color: s.color, side: s.side } }; draw(); $("#sheet").hidden = false; }
function openGlobal() { const g = cfg.global || {}; draft = { scope: "global", data: { logoId: g.logoId || null, bgId: g.bgId || null, bg: g.bg || "pasto", trayId: g.trayId || null } }; draw(); $("#sheet").hidden = false; }
function draw() {
  const d = draft.data;
  $("#card").innerHTML = draft.scope === "global" ? `<h2 id="sheetTitle">Fondo, bandeja y logo</h2>
    <div class="fld">Fondo<div class="seg"><button type="button" class="b" data-bg="cuadros" aria-pressed="${d.bg === "cuadros" && !d.bgId}">Cuadros</button><button type="button" class="b" data-bg="pasto" aria-pressed="${d.bg === "pasto" && !d.bgId}">Cielo y pasto</button></div></div>
    ${phField("O sube tu propio fondo", "bgId", d.bgId, "Horizontal, se ajusta a toda la pantalla.")}
    ${phField("Bandeja o canasta del centro", "trayId", d.trayId, "PNG sin fondo. Vacío = tu bandeja de Canva.")}
    ${phField("Logo Sugar Club", "logoId", d.logoId, "PNG sin fondo.")}
    <div class="acts"><button type="button" class="b" data-close>Cancelar</button><button type="button" class="b pri" id="saveBtn">Guardar</button></div>`
  : `<h2 id="sheetTitle">${esc(d.label)}</h2>
    <label class="fld">Nombre del botón<input type="text" id="fLabel" maxlength="22" value="${esc(d.label)}"></label>
    ${phField("Foto del botón", "photoId", d.photoId, "Se ve en el círculo y cae en la bandeja.")}
    <label class="fld">Color del círculo<input type="color" id="fColor" value="${esc(d.color)}"></label>
    <div class="fld">Lado<div class="seg"><button type="button" class="b" data-side="left" aria-pressed="${d.side === "left"}">Izquierda</button><button type="button" class="b" data-side="right" aria-pressed="${d.side === "right"}">Derecha</button></div></div>
    <div class="acts"><button type="button" class="b" data-reset>Volver al original</button><span style="display:flex;gap:8px"><button type="button" class="b" data-close>Cancelar</button><button type="button" class="b pri" id="saveBtn">Guardar</button></span></div>`;
}
function closeSheet() { draft = null; $("#sheet").hidden = true; }
$("#card").addEventListener("input", e => { if (e.target.id === "fLabel") draft.data.label = e.target.value; if (e.target.id === "fColor") draft.data.color = e.target.value; });
$("#card").addEventListener("change", async e => {
  const k = e.target.dataset.up; if (!k || !e.target.files[0]) return;
  const f = e.target.files[0]; if (f.size > 20 * 1024 * 1024) return toast("La foto pesa demasiado (máx. 20 MB)");
  toast("Subiendo foto…");
  try { const r = await assets.upload(f); draft.data[k] = r.id; draw(); toast("Foto lista, toca Guardar"); }
  catch (err) { toast(err?.code === "unsupported_type" ? "Usa JPG, PNG o WebP" : "No se pudo subir la foto"); }
});
$("#card").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.clear) { draft.data[b.dataset.clear] = null; draw(); }
  if (b.dataset.bg) { draft.data.bg = b.dataset.bg; draft.data.bgId = null; draw(); }
  if (b.dataset.side) { draft.data.side = b.dataset.side; draw(); }
  if (b.dataset.close !== undefined) closeSheet();
  if (b.dataset.reset !== undefined) await save(c => { delete c.items[draft.id]; });
  if (b.id === "saveBtn") await save(c => { if (draft.scope === "global") c.global = { ...c.global, ...draft.data }; else c.items[draft.id] = { ...draft.data }; });
});
async function save(mut) {
  const next = structuredClone(cfg); next.items ||= {}; next.global ||= {}; mut(next);
  try { await ref.set({ ...next, actualizado: Date.now() }); cfg = next; render(); closeSheet(); toast("Guardado ✓"); }
  catch (err) { toast(err?.code === "not_granted" ? "No tienes permiso para editar" : "No se pudo guardar. Inténtalo otra vez."); }
}
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

render();
(async () => {
  db = await window.claude?.use?.("db");
  if (db) { ref = db.doc("home/picnic"); ref.onSnapshot(s => { const d = s.exists ? s.data() : null; cfg = { items: d?.items || {}, global: d?.global || {} }; if (!draft) render(); }, () => {}); }
})();
</script>
